<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>文字表格</title>

  <style>
    .character-row {
      margin-bottom: 8px;
      white-space: nowrap;
    }

    .character-row input {
      font-size: 16px;
      margin-left: 8px;
      padding: 2px 4px;
      box-sizing: border-box;
    }

    .character-row input:first-of-type {
      width: 8em;
    }

    .character-row input:last-of-type {
      width: 4em;
    }

    .character-link {
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      margin-right: 8px;
    }

    .toolbar {
      margin-bottom: 15px;
    }

    .github-settings {
      margin-bottom: 15px;
      padding: 12px;
      border: 1px solid #cccccc;
      border-radius: 8px;
      max-width: 600px;
    }

    .github-settings input {
      display: block;
      width: 100%;
      max-width: 500px;
      box-sizing: border-box;
      margin-top: 6px;
      margin-bottom: 10px;
      padding: 8px;
      font-size: 15px;
    }

    button {
      padding: 8px 14px;
      margin-right: 8px;
      margin-bottom: 8px;
      cursor: pointer;
    }

    #status {
      margin-top: 10px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

  <div class="github-settings">
    <strong>GitHub 設定</strong>

    <label for="githubToken">
      GitHub Token：
    </label>

    <input
      id="githubToken"
      type="password"
      placeholder="貼上你的 GitHub Token"
      autocomplete="off"
    >

    <p>
      Token 只會暫存在目前頁面中、不會寫入 mozi.txt。
    </p>
  </div>

  <div class="toolbar">
    <button id="githubSaveButton">
      儲存到 GitHub
    </button>

    <button id="downloadButton">
      下載更新後的 mozi.txt
    </button>

    <button id="clearButton">
      清除本機保存資料
    </button>
  </div>

  <div id="status"></div>

  <div id="content">
    正在載入 mozi.txt...
  </div>

  <script>
    let moziRows = [];

    const STORAGE_KEY = 'moziRows';

    const GITHUB_OWNER = 'tayloryep777-web';
    const GITHUB_REPOSITORY = 'mozi';
    const GITHUB_BRANCH = 'mozi';
    const GITHUB_FILE_PATH = 'mozi.txt';

    const ZI_TOOLS_TAB = 'zi_tools_tab';
    const KAOM_TAB = 'kaom_tab';

    function setStatus(message) {
      document.getElementById('status').textContent = message;
    }

    function openZiTools(character) {
      const url =
        'https://zi.tools/zi/' +
        encodeURIComponent(character);

      const tab = window.open('', ZI_TOOLS_TAB);

      if (tab) {
        tab.location.href = url;
        tab.focus();
      }
    }

    function searchKaom(word) {
      const form = document.createElement('form');

      form.method = 'post';
      form.action = 'http://www.kaom.net/book_xungu8.php';
      form.target = KAOM_TAB;

      const input = document.createElement('input');
      input.type = 'hidden';
      input.name = 'word';
      input.value = word;

      const bianti = document.createElement('input');
      bianti.type = 'hidden';
      bianti.name = 'bianti';
      bianti.value = 'yes';

      const page = document.createElement('input');
      page.type = 'hidden';
      page.name = 'page';
      page.value = 'no';

      form.appendChild(input);
      form.appendChild(bianti);
      form.appendChild(page);

      document.body.appendChild(form);

      form.submit();

      form.remove();
    }

    function openBothWebsites(character) {
      openZiTools(character);
      searchKaom(character);
    }

    async function loadMozi() {
      try {
        const response = await fetch('mozi.txt');

        if (!response.ok) {
          throw new Error('找不到 mozi.txt');
        }

        const text = await response.text();

        const lines = text
          .split(/\r?\n/)
          .filter(line => line.trim() !== '');

        moziRows = lines.map(function(line) {
          const columns = line.split('\t');

          return {
            character: columns[0] || '',
            second: columns[1] || '',
            third: columns[2] || ''
          };
        });

        const savedData = localStorage.getItem(STORAGE_KEY);

        if (savedData) {
          try {
            const savedRows = JSON.parse(savedData);

            if (Array.isArray(savedRows)) {
              moziRows = savedRows;
            }
          } catch (error) {
            console.log(
              'localStorage 資料格式錯誤、改用 mozi.txt'
            );
          }
        }

        renderRows();

      } catch (error) {
        document.getElementById('content').textContent =
          '載入失敗：' + error.message;
      }
    }

    function saveToLocalStorage() {
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(moziRows)
      );
    }

    function renderRows() {
      const content = document.getElementById('content');

      content.innerHTML = '';

      moziRows.forEach(function(item, index) {
        const row = document.createElement('div');

        row.className = 'character-row';

        const characterLink = document.createElement('a');

        characterLink.href = '#';
        characterLink.className = 'character-link';
        characterLink.textContent = item.character;

        characterLink.addEventListener(
          'click',
          function(event) {
            event.preventDefault();

            openBothWebsites(item.character);
          }
        );

        const input1 = document.createElement('input');

        input1.type = 'text';
        input1.value = item.second;

        input1.addEventListener(
          'input',
          function() {
            moziRows[index].second = input1.value;

            saveToLocalStorage();
          }
        );

        const input2 = document.createElement('input');

        input2.type = 'text';
        input2.value = item.third;

        input2.addEventListener(
          'input',
          function() {
            moziRows[index].third = input2.value;

            saveToLocalStorage();
          }
        );

        row.appendChild(characterLink);
        row.appendChild(input1);
        row.appendChild(input2);

        content.appendChild(row);
      });
    }

    function createMoziText() {
      return moziRows
        .map(function(item) {
          return [
            item.character,
            item.second,
            item.third
          ].join('\t');
        })
        .join('\n');
    }

    function downloadMozi() {
      const text = createMoziText();

      const blob = new Blob(
        [text],
        {
          type: 'text/plain;charset=utf-8'
        }
      );

      const url = URL.createObjectURL(blob);

      const link = document.createElement('a');

      link.href = url;
      link.download = 'mozi.txt';

      document.body.appendChild(link);

      link.click();

      link.remove();

      URL.revokeObjectURL(url);
    }

    async function getGithubFile() {
      const apiUrl =
        'https://api.github.com/repos/' +
        GITHUB_OWNER + '/' +
        GITHUB_REPOSITORY +
        '/contents/' +
        GITHUB_FILE_PATH +
        '?ref=' +
        encodeURIComponent(GITHUB_BRANCH);

      const response = await fetch(apiUrl, {
        method: 'GET',
        headers: {
          'Accept': 'application/vnd.github+json'
        }
      });

      if (!response.ok) {
        throw new Error(
          '無法取得 GitHub 檔案、HTTP ' +
          response.status
        );
      }

      return await response.json();
    }

    async function saveToGithub() {
      const token =
        document.getElementById('githubToken').value.trim();

      if (!token) {
        setStatus('請先輸入 GitHub Token。');
        return;
      }

      const confirmSave = confirm(
        '確定要把目前內容儲存到 GitHub 的 mozi.txt 嗎？'
      );

      if (!confirmSave) {
        return;
      }

      const button =
        document.getElementById('githubSaveButton');

      button.disabled = true;

      setStatus('正在取得 GitHub 原始檔案資訊...');

      try {
        const githubFile = await getGithubFile();

        const text = createMoziText();

        const encodedContent = btoa(
          unescape(
            encodeURIComponent(text)
          )
        );

        const apiUrl =
          'https://api.github.com/repos/' +
          GITHUB_OWNER + '/' +
          GITHUB_REPOSITORY +
          '/contents/' +
          GITHUB_FILE_PATH;

        const response = await fetch(apiUrl, {
          method: 'PUT',

          headers: {
            'Accept': 'application/vnd.github+json',
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },

          body: JSON.stringify({
            message: 'Update mozi.txt from web editor',
            content: encodedContent,
            sha: githubFile.sha,
            branch: GITHUB_BRANCH
          })
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(
            result.message ||
            'GitHub 更新失敗、HTTP ' +
            response.status
          );
        }

        setStatus(
          '儲存成功！\n' +
          'GitHub 已更新 mozi.txt。\n' +
          'Commit：' +
          result.commit.sha
        );

      } catch (error) {
        setStatus(
          '儲存失敗：\n' +
          error.message
        );

      } finally {
        button.disabled = false;
      }
    }

    function clearLocalStorage() {
      localStorage.removeItem(STORAGE_KEY);

      location.reload();
    }

    document
      .getElementById('githubSaveButton')
      .addEventListener(
        'click',
        saveToGithub
      );

    document
      .getElementById('downloadButton')
      .addEventListener(
        'click',
        downloadMozi
      );

    document
      .getElementById('clearButton')
      .addEventListener(
        'click',
        clearLocalStorage
      );

    loadMozi();
  </script>

</body>
</html>
