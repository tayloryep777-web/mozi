<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>文字表格</title>

  <style>
    .character-row {
      margin-bottom: 8px;
      white-space: nowrap;
    }

    /*
      第一個輸入框：8 個漢字左右
      第二個輸入框：4 個漢字左右
    */
    .character-row input {
      font-size: 16px;
      margin-left: 8px;
      padding: 2px 4px;
      box-sizing: border-box;
    }

    .character-row input:first-of-type {
      width: 8em;
    }

    .character-row input:last-of-type {
      width: 4em;
    }

    /*
      漢字可以點擊
    */
    .character-link {
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      margin-right: 8px;
    }

    .toolbar {
      margin-bottom: 15px;
    }

    button {
      padding: 8px 14px;
      margin-right: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="toolbar">
    <button id="downloadButton">
      下載
    </button>

    <button id="clearButton">
      清除
    </button>
  </div>

  <div id="content">
    正在載入 mozi.txt...
  </div>


  <script>
    /*
      所有資料
    */
    let moziRows = [];


    /*
      localStorage 名稱
    */
    const STORAGE_KEY = 'moziRows';


    /*
      固定分頁名稱
    */
    const ZI_TOOLS_TAB = 'zi_tools_tab';
    const KAOM_TAB = 'kaom_tab';


    /*
      開啟或覆蓋 zi.tools 分頁
    */
    function openZiTools(character) {
      const url =
        'https://zi.tools/zi/' +
        encodeURIComponent(character);

      const tab = window.open('', ZI_TOOLS_TAB);

      if (tab) {
        tab.location.href = url;
        tab.focus();
      }
    }


    /*
      開啟或覆蓋 kaom.net 分頁

      注意：這裡使用 http
    */
    function searchKaom(word) {
      const form = document.createElement('form');

      form.method = 'post';

      form.action =
        'http://www.kaom.net/book_xungu8.php';

      /*
        固定使用 kaom_tab 分頁
      */
      form.target = KAOM_TAB;


      /*
        查詢漢字
      */
      const input = document.createElement('input');

      input.type = 'hidden';
      input.name = 'word';
      input.value = word;


      /*
        查詢簡繁、變體
      */
      const bianti = document.createElement('input');

      bianti.type = 'hidden';
      bianti.name = 'bianti';
      bianti.value = 'yes';


      /*
        不顯示頁碼
      */
      const page = document.createElement('input');

      page.type = 'hidden';
      page.name = 'page';
      page.value = 'no';


      form.appendChild(input);
      form.appendChild(bianti);
      form.appendChild(page);

      document.body.appendChild(form);

      form.submit();

      form.remove();
    }


    /*
      點擊漢字時：

      1. 開啟或覆蓋 zi.tools
      2. 開啟或覆蓋 kaom.net
    */
    function openBothWebsites(character) {
      openZiTools(character);

      searchKaom(character);
    }


    /*
      載入 mozi.txt
    */
    async function loadMozi() {
      try {
        const response = await fetch('mozi.txt');

        if (!response.ok) {
          throw new Error('找不到 mozi.txt');
        }

        const text = await response.text();


        /*
          每行一筆資料
        */
        const lines = text
          .split(/\r?\n/)
          .filter(line => line.trim() !== '');


        /*
          mozi.txt 格式：

          第一列：漢字
          第二列：第一個輸入框
          第三列：第二個輸入框

          使用 Tab 分隔
        */
        moziRows = lines.map(function(line) {
          const columns = line.split('\t');

          return {
            character: columns[0] || '',
            second: columns[1] || '',
            third: columns[2] || ''
          };
        });


        /*
          讀取 localStorage

          如果之前修改過、優先使用本機資料
        */
        const savedData =
          localStorage.getItem(STORAGE_KEY);

        if (savedData) {
          try {
            const savedRows = JSON.parse(savedData);

            if (Array.isArray(savedRows)) {
              moziRows = savedRows;
            }
          } catch (error) {
            console.log(
              'localStorage 資料格式錯誤、改用 mozi.txt'
            );
          }
        }


        renderRows();

      } catch (error) {
        document.getElementById('content').textContent =
          '載入失敗：' + error.message;
      }
    }


    /*
      保存到 localStorage
    */
    function saveToLocalStorage() {
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(moziRows)
      );
    }


    /*
      顯示所有資料列
    */
    function renderRows() {
      const content =
        document.getElementById('content');

      content.innerHTML = '';


      moziRows.forEach(function(item, index) {
        const row = document.createElement('div');

        row.className = 'character-row';


        /*
          最前面的漢字

          點擊後同時開啟：

          zi.tools
          kaom.net
        */
        const characterLink =
          document.createElement('a');

        characterLink.href = '#';

        characterLink.className =
          'character-link';

        characterLink.textContent =
          item.character;

        characterLink.addEventListener(
          'click',
          function(event) {
            event.preventDefault();

            openBothWebsites(item.character);
          }
        );


        /*
          第一個輸入框：

          對應 mozi.txt 第二列
        */
        const input1 =
          document.createElement('input');

        input1.type = 'text';

        input1.value = item.second;

        input1.addEventListener(
          'input',
          function() {
            moziRows[index].second =
              input1.value;

            saveToLocalStorage();
          }
        );


        /*
          第二個輸入框：

          對應 mozi.txt 第三列
        */
        const input2 =
          document.createElement('input');

        input2.type = 'text';

        input2.value = item.third;

        input2.addEventListener(
          'input',
          function() {
            moziRows[index].third =
              input2.value;

            saveToLocalStorage();
          }
        );


        /*
          顯示：

          丈 [第一個輸入框] [第二個輸入框]
        */
        row.appendChild(characterLink);

        row.appendChild(input1);

        row.appendChild(input2);

        content.appendChild(row);
      });
    }


    /*
      下載更新後的 mozi.txt
    */
    function downloadMozi() {
      const text =
        moziRows.map(function(item) {
          return [
            item.character,
            item.second,
            item.third
          ].join('\t');
        }).join('\n');


      const blob =
        new Blob(
          [text],
          {
            type: 'text/plain;charset=utf-8'
          }
        );


      const url =
        URL.createObjectURL(blob);


      const link =
        document.createElement('a');

      link.href = url;

      link.download = 'mozi.txt';

      document.body.appendChild(link);

      link.click();

      link.remove();

      URL.revokeObjectURL(url);
    }


    /*
      清除 localStorage

      清除後重新讀取 mozi.txt
    */
    function clearLocalStorage() {
      localStorage.removeItem(STORAGE_KEY);

      location.reload();
    }


    /*
      綁定下載按鈕
    */
    document
      .getElementById('downloadButton')
      .addEventListener(
        'click',
        downloadMozi
      );


    /*
      綁定清除按鈕
    */
    document
      .getElementById('clearButton')
      .addEventListener(
        'click',
        clearLocalStorage
      );


    /*
      啟動
    */
    loadMozi();
  </script>

</body>
</html>
