<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>文字表格</title>

  <style>
    .character-row {
      margin-bottom: 8px;
      white-space: nowrap;
    }

    .character-row input {
      font-size: 16px;
      margin-left: 8px;
      padding: 2px 4px;
      box-sizing: border-box;
    }

    .character-row input:first-of-type {
      width: 8em;
    }

    .character-row input:last-of-type {
      width: 4em;
    }

    .character-link {
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      margin-right: 8px;
    }

    .toolbar {
      margin-bottom: 15px;
    }

    .github-settings {
      margin-bottom: 15px;
      padding: 12px;
      border: 1px solid #cccccc;
      border-radius: 8px;
      max-width: 600px;
    }

    .github-settings input {
      display: block;
      width: 100%;
      max-width: 500px;
      box-sizing: border-box;
      margin-top: 6px;
      margin-bottom: 10px;
      padding: 8px;
      font-size: 15px;
    }

    .github-settings p {
      margin: 5px 0 0;
      font-size: 13px;
      color: #666666;
    }

    button {
      padding: 8px 14px;
      margin-right: 8px;
      margin-bottom: 8px;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.6;
    }

    #status {
      margin-top: 10px;
      margin-bottom: 15px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

  <div class="github-settings">
    <strong>GitHub 設定</strong>

    <label for="githubToken">
      GitHub Token：
    </label>

    <input
      id="githubToken"
      type="password"
      placeholder="貼上你的 GitHub Token"
      autocomplete="off"
    >

    <p>
      Token 會保存到目前網站的 Cookie、有效期 30 天。
    </p>
  </div>

  <div class="toolbar">
    <button id="githubSaveButton">
      儲存到 GitHub
    </button>
  </div>

  <div id="status"></div>

  <div id="content">
    正在載入 mozi.txt...
  </div>

  <script>
    let moziRows = [];

    const STORAGE_KEY = 'moziRows';

    const TOKEN_COOKIE_NAME = 'mozi_github_token';

    const GITHUB_OWNER = 'tayloryep777-web';
    const GITHUB_REPOSITORY = 'mozi';
    const GITHUB_BRANCH = 'mozi';
    const GITHUB_FILE_PATH = 'mozi.txt';

    const ZI_TOOLS_TAB = 'zi_tools_tab';
    const KAOM_TAB = 'kaom_tab';

    /*
     * 顯示狀態訊息
     */
    function setStatus(message) {
      document.getElementById('status').textContent =
        message;
    }

    /*
     * 將 GitHub Token 保存到 Cookie
     *
     * max-age=2592000 代表保存 30 天
     */
    function saveTokenToCookie(token) {
      document.cookie =
        TOKEN_COOKIE_NAME +
        '=' +
        encodeURIComponent(token) +
        '; max-age=2592000' +
        '; path=/' +
        '; SameSite=Lax';
    }

    /*
     * 從 Cookie 讀取 GitHub Token
     */
    function loadTokenFromCookie() {
      const cookies = document.cookie.split(';');

      for (const cookie of cookies) {
        const trimmedCookie = cookie.trim();

        const prefix =
          TOKEN_COOKIE_NAME + '=';

        if (trimmedCookie.startsWith(prefix)) {
          return decodeURIComponent(
            trimmedCookie.substring(prefix.length)
          );
        }
      }

      return '';
    }

    /*
     * 開啟 zi.tools
     */
    function openZiTools(character) {
      const url =
        'https://zi.tools/zi/' +
        encodeURIComponent(character);

      const tab = window.open('', ZI_TOOLS_TAB);

      if (tab) {
        tab.location.href = url;
        tab.focus();
      }
    }

    /*
     * 使用 POST 搜尋 kaom.net
     */
    function searchKaom(word) {
      const form = document.createElement('form');

      form.method = 'post';

      form.action =
        'http://www.kaom.net/book_xungu8.php';

      form.target = KAOM_TAB;

      const input = document.createElement('input');

      input.type = 'hidden';
      input.name = 'word';
      input.value = word;

      const bianti = document.createElement('input');

      bianti.type = 'hidden';
      bianti.name = 'bianti';
      bianti.value = 'yes';

      const page = document.createElement('input');

      page.type = 'hidden';
      page.name = 'page';
      page.value = 'no';

      form.appendChild(input);
      form.appendChild(bianti);
      form.appendChild(page);

      document.body.appendChild(form);

      form.submit();

      form.remove();
    }

    /*
     * 同時開啟兩個網站
     */
    function openBothWebsites(character) {
      openZiTools(character);
      searchKaom(character);
    }

    /*
     * 從 mozi.txt 載入資料
     */
    async function loadMozi() {
      try {
        const response = await fetch('mozi.txt');

        if (!response.ok) {
          throw new Error(
            '找不到 mozi.txt'
          );
        }

        const text = await response.text();

        const lines = text
          .split(/\r?\n/)
          .filter(function(line) {
            return line.trim() !== '';
          });

        moziRows = lines.map(function(line) {
          const columns = line.split('\t');

          return {
            character: columns[0] || '',
            second: columns[1] || '',
            third: columns[2] || ''
          };
        });

        /*
         * 如果瀏覽器有保存修改內容
         * 就優先使用 localStorage
         */
        const savedData =
          localStorage.getItem(STORAGE_KEY);

        if (savedData) {
          try {
            const savedRows = JSON.parse(savedData);

            if (Array.isArray(savedRows)) {
              moziRows = savedRows;
            }
          } catch (error) {
            console.log(
              'localStorage 資料格式錯誤、改用 mozi.txt'
            );
          }
        }

        renderRows();

      } catch (error) {
        document.getElementById('content').textContent =
          '載入失敗：' + error.message;
      }
    }

    /*
     * 保存表格修改內容
     */
    function saveToLocalStorage() {
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(moziRows)
      );
    }

    /*
     * 顯示所有漢字與輸入框
     */
    function renderRows() {
      const content =
        document.getElementById('content');

      content.innerHTML = '';

      moziRows.forEach(function(item, index) {
        const row = document.createElement('div');

        row.className = 'character-row';

        /*
         * 漢字連結
         */
        const characterLink =
          document.createElement('a');

        characterLink.href = '#';

        characterLink.className =
          'character-link';

        characterLink.textContent =
          item.character;

        characterLink.addEventListener(
          'click',
          function(event) {
            event.preventDefault();

            openBothWebsites(
              item.character
            );
          }
        );

        /*
         * 第二欄輸入框
         */
        const input1 =
          document.createElement('input');

        input1.type = 'text';

        input1.value =
          item.second;

        input1.addEventListener(
          'input',
          function() {
            moziRows[index].second =
              input1.value;

            saveToLocalStorage();
          }
        );

        /*
         * 第三欄輸入框
         */
        const input2 =
          document.createElement('input');

        input2.type = 'text';

        input2.value =
          item.third;

        input2.addEventListener(
          'input',
          function() {
            moziRows[index].third =
              input2.value;

            saveToLocalStorage();
          }
        );

        row.appendChild(characterLink);
        row.appendChild(input1);
        row.appendChild(input2);

        content.appendChild(row);
      });
    }

    /*
     * 將目前表格轉成 mozi.txt 內容
     *
     * 每欄使用 Tab 分隔
     */
    function createMoziText() {
      return moziRows
        .map(function(item) {
          return [
            item.character,
            item.second,
            item.third
          ].join('\t');
        })
        .join('\n');
    }

    /*
     * 取得 GitHub 上 mozi.txt 的資訊
     *
     * 主要是取得 sha
     * GitHub 更新檔案時需要 sha
     */
    async function getGithubFile() {
      const token =
        document.getElementById('githubToken')
          .value
          .trim();

      const apiUrl =
        'https://api.github.com/repos/' +
        GITHUB_OWNER + '/' +
        GITHUB_REPOSITORY +
        '/contents/' +
        GITHUB_FILE_PATH +
        '?ref=' +
        encodeURIComponent(GITHUB_BRANCH);

      const response = await fetch(apiUrl, {
        method: 'GET',

        headers: {
          'Accept':
            'application/vnd.github+json',

          'Authorization':
            'Bearer ' + token
        }
      });

      const result =
        await response.json();

      if (!response.ok) {
        throw new Error(
          result.message ||
          '無法取得 GitHub 檔案、HTTP ' +
          response.status
        );
      }

      return result;
    }

    /*
     * 將目前內容儲存到 GitHub
     */
    async function saveToGithub() {
      const token =
        document.getElementById('githubToken')
          .value
          .trim();

      if (!token) {
        setStatus(
          '請先輸入 GitHub Token。'
        );

        return;
      }

      /*
       * 自動保存 Token 到 Cookie
       */
      saveTokenToCookie(token);

      const button =
        document.getElementById(
          'githubSaveButton'
        );

      button.disabled = true;

      setStatus(
        '正在取得 GitHub 原始檔案資訊...'
      );

      try {
        /*
         * 先取得目前 GitHub 檔案的 sha
         */
        const githubFile =
          await getGithubFile();

        /*
         * 取得目前表格內容
         */
        const text =
          createMoziText();

        /*
         * 將 UTF-8 文字轉成 Base64
         *
         * btoa() 本身不能直接處理中文
         */
        const encodedContent =
          btoa(
            unescape(
              encodeURIComponent(text)
            )
          );

        const apiUrl =
          'https://api.github.com/repos/' +
          GITHUB_OWNER + '/' +
          GITHUB_REPOSITORY +
          '/contents/' +
          GITHUB_FILE_PATH;

        const response = await fetch(apiUrl, {
          method: 'PUT',

          headers: {
            'Accept':
              'application/vnd.github+json',

            'Content-Type':
              'application/json',

            'Authorization':
              'Bearer ' + token
          },

          body: JSON.stringify({
            message:
              'Update mozi.txt from web editor',

            content:
              encodedContent,

            sha:
              githubFile.sha,

            branch:
              GITHUB_BRANCH
          })
        });

        const result =
          await response.json();

        if (!response.ok) {
          throw new Error(
            result.message ||
            'GitHub 更新失敗、HTTP ' +
            response.status
          );
        }

        setStatus(
          '儲存成功！\n' +
          'GitHub 已更新 mozi.txt。\n' +
          'Commit：' +
          result.commit.sha
        );

      } catch (error) {
        setStatus(
          '儲存失敗：\n' +
          error.message
        );

      } finally {
        button.disabled = false;
      }
    }

    /*
     * 自動填入 Cookie 裡的 Token
     */
    function initializeToken() {
      const savedToken =
        loadTokenFromCookie();

      if (savedToken) {
        document.getElementById(
          'githubToken'
        ).value = savedToken;
      }

      /*
       * 使用者手動修改 Token 時
       * 立即更新 Cookie
       */
      document.getElementById(
        'githubToken'
      ).addEventListener(
        'input',
        function() {
          const token =
            document.getElementById(
              'githubToken'
            ).value.trim();

          if (token) {
            saveTokenToCookie(token);
          }
        }
      );
    }

    /*
     * 綁定按鈕
     */
    document.getElementById(
      'githubSaveButton'
    ).addEventListener(
      'click',
      saveToGithub
    );

    /*
     * 初始化
     */
    initializeToken();

    loadMozi();
  </script>

</body>
</html>
