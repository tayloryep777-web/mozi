<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>文字表格</title>

  <style>
    .character-row {
      margin-bottom: 8px;
    }

    .character-row input {
  margin-left: 8px;
  box-sizing: border-box;
}

/* 第一個輸入框：5 個漢字寬 */
.character-row input:first-of-type {
  width: 6em;
}

/* 第二個輸入框：2 個漢字寬 */
.character-row input:last-of-type {
  width: 3em;
}
    }

    .toolbar {
      margin-bottom: 15px;
    }

    button {
      padding: 8px 14px;
      margin-right: 8px;
      cursor: pointer;
    }

    a {
      margin-right: 8px;
    }
  </style>
</head>

<body>

  <div class="toolbar">
    <button id="downloadButton">
      下載更新後的 mozi.txt
    </button>

    <button id="clearButton">
      清除本機保存資料
    </button>
  </div>

  <div id="content">
    正在載入 mozi.txt...
  </div>


  <script>
    let moziRows = [];

    const STORAGE_KEY = 'moziRows';


    /*
      kaom.net 訓詁查詢
    */
    function searchKaom(word) {
      const form = document.createElement('form');

      form.method = 'post';
      form.action = 'http://www.kaom.net/book_xungu8.php';
      form.target = '_blank';

      const input = document.createElement('input');
      input.type = 'hidden';
      input.name = 'word';
      input.value = word;

      const bianti = document.createElement('input');
      bianti.type = 'hidden';
      bianti.name = 'bianti';
      bianti.value = 'yes';

      const page = document.createElement('input');
      page.type = 'hidden';
      page.name = 'page';
      page.value = 'no';

      form.appendChild(input);
      form.appendChild(bianti);
      form.appendChild(page);

      document.body.appendChild(form);

      form.submit();

      form.remove();
    }


    /*
      載入 mozi.txt
    */
    async function loadMozi() {
      try {
        const response = await fetch('mozi.txt');

        if (!response.ok) {
          throw new Error('找不到 mozi.txt');
        }

        const text = await response.text();

        const lines = text
          .split(/\r?\n/)
          .filter(line => line.trim() !== '');

        moziRows = lines.map(function(line) {
          const columns = line.split('\t');

          return {
            character: columns[0] || '',
            second: columns[1] || '',
            third: columns[2] || ''
          };
        });


        /*
          讀取 localStorage

          只有在 localStorage 有資料時才使用
        */
        const savedData = localStorage.getItem(STORAGE_KEY);

        if (savedData) {
          try {
            const savedRows = JSON.parse(savedData);

            if (Array.isArray(savedRows)) {
              moziRows = savedRows;
            }
          } catch (error) {
            console.log('localStorage 資料格式錯誤');
          }
        }

        renderRows();

      } catch (error) {
        document.getElementById('content').textContent =
          '載入失敗：' + error.message;
      }
    }


    /*
      保存到 localStorage
    */
    function saveToLocalStorage() {
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(moziRows)
      );
    }


    /*
      顯示資料
    */
    function renderRows() {
      const content = document.getElementById('content');

      content.innerHTML = '';

      moziRows.forEach(function(item, index) {
        const row = document.createElement('div');

        row.className = 'character-row';


        /*
          第一列：普通漢字
        */
        const characterText = document.createTextNode(
          item.character + ' '
        );


        /*
          第二列：固定顯示「字統」

          連結目標是當前漢字
        */
        const toolsLink = document.createElement('a');

        toolsLink.href =
          'https://zi.tools/zi/' +
          encodeURIComponent(item.character);

        toolsLink.target = '_blank';
        toolsLink.rel = 'noopener noreferrer';

        toolsLink.textContent = '字統';


        /*
          第三列：固定顯示「訓詁」

          使用 kaom.net POST 查詢
        */
        const kaomLink = document.createElement('a');

        kaomLink.href = '#';
        kaomLink.textContent = '訓詁';

        kaomLink.addEventListener('click', function(event) {
          event.preventDefault();

          searchKaom(item.character);
        });


        /*
          第一個輸入框：

          對應 mozi.txt 第二列
        */
        const input1 = document.createElement('input');

        input1.type = 'text';
        input1.value = item.second;

        input1.addEventListener('input', function() {
          moziRows[index].second = input1.value;

          saveToLocalStorage();
        });


        /*
          第二個輸入框：

          對應 mozi.txt 第三列
        */
        const input2 = document.createElement('input');

        input2.type = 'text';
        input2.value = item.third;

        input2.addEventListener('input', function() {
          moziRows[index].third = input2.value;

          saveToLocalStorage();
        });


        /*
          顯示順序：

          丈　字統　訓詁　[十又]　[丈]
        */

        row.appendChild(characterText);

        row.appendChild(toolsLink);

        row.appendChild(
          document.createTextNode(' ')
        );

        row.appendChild(kaomLink);

        row.appendChild(
          document.createTextNode(' ')
        );

        row.appendChild(input1);
        row.appendChild(input2);

        content.appendChild(row);
      });
    }


    /*
      下載更新後的 mozi.txt
    */
    function downloadMozi() {
      const text = moziRows.map(function(item) {
        return [
          item.character,
          item.second,
          item.third
        ].join('\t');
      }).join('\n');


      const blob = new Blob(
        [text],
        {
          type: 'text/plain;charset=utf-8'
        }
      );

      const url = URL.createObjectURL(blob);

      const link = document.createElement('a');

      link.href = url;
      link.download = 'mozi.txt';

      document.body.appendChild(link);

      link.click();

      link.remove();

      URL.revokeObjectURL(url);
    }


    /*
      清除 localStorage
    */
    function clearLocalStorage() {
      localStorage.removeItem(STORAGE_KEY);

      location.reload();
    }


    document
      .getElementById('downloadButton')
      .addEventListener('click', downloadMozi);


    document
      .getElementById('clearButton')
      .addEventListener('click', clearLocalStorage);


    loadMozi();
  </script>

</body>
</html>
