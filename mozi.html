<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>文字表格</title>

  <style>
    body {
      font-family: sans-serif;
      font-size: 16px;
      margin: 20px;
    }

    .character-row {
      margin-bottom: 8px;
      white-space: nowrap;
    }

    .character-link {
      display: inline-block;
      width: 2em;
      font-size: 20px;
      text-decoration: none;
    }

    .character-row input {
      font-size: 16px;
      margin-left: 8px;
      padding: 3px 5px;
    }

    .second-input {
      width: 8em;
    }

    .third-input {
      width: 4em;
    }

    .github-box {
      margin-bottom: 20px;
      padding: 12px;
      border: 1px solid #cccccc;
      border-radius: 8px;
      max-width: 600px;
    }

    .github-box input {
      box-sizing: border-box;
      width: 100%;
      margin: 6px 0;
      padding: 8px;
      font-size: 16px;
    }

    button {
      padding: 8px 14px;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    #status {
      margin-top: 10px;
      white-space: pre-wrap;
      color: #333333;
    }
  </style>
</head>

<body>

  <div class="github-box">

    <h2>GitHub 儲存設定</h2>

    <label for="githubToken">
      GitHub Token
    </label>

    <input
      id="githubToken"
      type="password"
      placeholder="輸入 GitHub Fine-grained Token"
      autocomplete="off"
    >

    <button
      id="githubSaveButton"
      type="button"
    >
      儲存到 GitHub
    </button>

    <div id="status"></div>

  </div>


  <div id="table"></div>


  <script>
    /*
      GitHub 設定
    */

    const GITHUB_OWNER =
      'tayloryep777-web';

    const GITHUB_REPOSITORY =
      'mozi';

    const GITHUB_BRANCH =
      'mozi';

    const GITHUB_FILE_PATH =
      'mozi.txt';


    /*
      本機資料設定
    */

    const STORAGE_KEY =
      'moziRows';


    /*
      Cookie 設定
    */

    const TOKEN_COOKIE_NAME =
      'mozi_github_token';


    /*
      固定分頁名稱
    */

    const ZI_TOOLS_TAB =
      'zi_tools_tab';

    const KAOM_TAB =
      'kaom_tab';


    /*
      全域資料
    */

    let moziRows = [];


    /*
      取得 DOM
    */

    const table =
      document.getElementById('table');

    const githubTokenInput =
      document.getElementById('githubToken');

    const githubSaveButton =
      document.getElementById(
        'githubSaveButton'
      );

    const status =
      document.getElementById('status');


    /*
      顯示狀態
    */

    function setStatus(message) {
      status.textContent = message;
    }


    /*
      儲存 Token 到 Cookie

      沒有設定 expires 或 max-age、
      因此這是瀏覽器工作階段 Cookie。
    */

    function saveTokenToCookie(token) {
      document.cookie =
        TOKEN_COOKIE_NAME +
        '=' +
        encodeURIComponent(token) +
        '; path=/' +
        '; SameSite=Lax';
    }


    /*
      從 Cookie 讀取 Token
    */

    function loadTokenFromCookie() {
      const cookies =
        document.cookie.split(';');

      for (
        let i = 0;
        i < cookies.length;
        i++
      ) {
        const cookie =
          cookies[i].trim();

        if (
          cookie.indexOf(
            TOKEN_COOKIE_NAME + '='
          ) === 0
        ) {
          return decodeURIComponent(
            cookie.substring(
              TOKEN_COOKIE_NAME.length + 1
            )
          );
        }
      }

      return '';
    }


    /*
      載入 Cookie 裡的 Token
    */

    function loadToken() {
      const token =
        loadTokenFromCookie();

      if (token) {
        githubTokenInput.value =
          token;
      }
    }


    /*
      解析 mozi.txt

      格式：

      漢字    第二欄    第三欄
    */

    function parseMoziText(text) {
      return text
        .split(/\r?\n/)
        .filter(function(line) {
          return line.trim() !== '';
        })
        .map(function(line) {
          const columns =
            line.split('\t');

          return {
            character:
              columns[0] || '',

            second:
              columns[1] || '',

            third:
              columns[2] || ''
          };
        });
    }


    /*
      將資料轉換成 mozi.txt 文字
    */

    function createMoziText() {
      return moziRows
        .map(function(item) {
          return [
            item.character,
            item.second,
            item.third
          ].join('\t');
        })
        .join('\n');
    }


    /*
      儲存資料到 localStorage
    */

    function saveToLocalStorage() {
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(moziRows)
      );
    }


    /*
      從 localStorage 讀取資料
    */

    function loadFromLocalStorage() {
      const saved =
        localStorage.getItem(
          STORAGE_KEY
        );

      if (!saved) {
        return false;
      }

      try {
        const parsed =
          JSON.parse(saved);

        if (
          !Array.isArray(parsed)
        ) {
          return false;
        }

        moziRows =
          parsed;

        return true;

      } catch (error) {
        console.error(
          '讀取本機資料失敗：',
          error
        );

        return false;
      }
    }


    /*
      開啟 zi.tools

      使用固定分頁、
      不使用 setTimeout。
    */

    function openZiTools(character) {
      const url =
        'https://zi.tools/zi/' +
        encodeURIComponent(character);

      let tab =
        window.open(
          '',
          ZI_TOOLS_TAB
        );

      if (!tab) {
        tab =
          window.open(
            url,
            ZI_TOOLS_TAB
          );
      } else {
        tab.location.replace(url);
        tab.focus();
      }
    }


    /*
      開啟 kaom.net

      使用 POST、
      使用固定分頁、
      不使用 setTimeout。
    */

    function searchKaom(word) {
      const form =
        document.createElement('form');

      form.method =
        'post';

      form.action =
        'http://www.kaom.net/book_xungu8.php';

      form.target =
        KAOM_TAB;

      form.style.display =
        'none';


      const wordInput =
        document.createElement('input');

      wordInput.type =
        'hidden';

      wordInput.name =
        'word';

      wordInput.value =
        word;


      const biantiInput =
        document.createElement('input');

      biantiInput.type =
        'hidden';

      biantiInput.name =
        'bianti';

      biantiInput.value =
        'yes';


      const pageInput =
        document.createElement('input');

      pageInput.type =
        'hidden';

      pageInput.name =
        'page';

      pageInput.value =
        'no';


      form.appendChild(
        wordInput
      );

      form.appendChild(
        biantiInput
      );

      form.appendChild(
        pageInput
      );

      document.body.appendChild(
        form
      );

      form.submit();

      form.remove();
    }


    /*
      同時開啟兩個網站
    */

    function openBothWebsites(character) {
      openZiTools(character);

      searchKaom(character);
    }


    /*
      建立表格
    */

    function renderTable() {
      table.innerHTML = '';

      moziRows.forEach(
        function(item, index) {
          const row =
            document.createElement('div');

          row.className =
            'character-row';


          const characterLink =
            document.createElement('a');

          characterLink.className =
            'character-link';

          characterLink.href =
            '#';

          characterLink.textContent =
            item.character;


          characterLink.addEventListener(
            'click',
            function(event) {
              event.preventDefault();

              openBothWebsites(
                item.character
              );
            }
          );


          const secondInput =
            document.createElement('input');

          secondInput.className =
            'second-input';

          secondInput.type =
            'text';

          secondInput.value =
            item.second;

          secondInput.addEventListener(
            'input',
            function(event) {
              moziRows[index].second =
                event.target.value;

              saveToLocalStorage();
            }
          );


          const thirdInput =
            document.createElement('input');

          thirdInput.className =
            'third-input';

          thirdInput.type =
            'text';

          thirdInput.value =
            item.third;

          thirdInput.addEventListener(
            'input',
            function(event) {
              moziRows[index].third =
                event.target.value;

              saveToLocalStorage();
            }
          );


          row.appendChild(
            characterLink
          );

          row.appendChild(
            secondInput
          );

          row.appendChild(
            thirdInput
          );

          table.appendChild(
            row
          );
        }
      );
    }


    /*
      取得 GitHub 最新檔案資訊
    */

    async function getGithubFile() {
      const token =
        githubTokenInput.value.trim();

      const apiUrl =
        'https://api.github.com/repos/' +
        GITHUB_OWNER +
        '/' +
        GITHUB_REPOSITORY +
        '/contents/' +
        GITHUB_FILE_PATH +
        '?ref=' +
        encodeURIComponent(
          GITHUB_BRANCH
        ) +
        '&t=' +
        Date.now();


      const response =
        await fetch(
          apiUrl,
          {
            method: 'GET',

            cache: 'no-store',

            headers: {
              'Accept':
                'application/vnd.github+json',

              'Authorization':
                'Bearer ' + token
            }
          }
        );


      const result =
        await response.json();


      if (!response.ok) {
        throw new Error(
          result.message ||
          '無法取得 GitHub 檔案、HTTP ' +
          response.status
        );
      }

      return result;
    }


    /*
      儲存到 GitHub
    */

    async function saveToGithub() {
      const token =
        githubTokenInput.value.trim();


      if (!token) {
        setStatus(
          '請先輸入 GitHub Token。'
        );

        return;
      }


      saveTokenToCookie(
        token
      );


      githubSaveButton.disabled =
        true;


      try {
        const text =
          createMoziText();


        const encodedContent =
          btoa(
            unescape(
              encodeURIComponent(
                text
              )
            )
          );


        const apiUrl =
          'https://api.github.com/repos/' +
          GITHUB_OWNER +
          '/' +
          GITHUB_REPOSITORY +
          '/contents/' +
          GITHUB_FILE_PATH;


        setStatus(
          '正在取得 GitHub 最新檔案資訊...'
        );


        let githubFile =
          await getGithubFile();


        for (
          let attempt = 1;
          attempt <= 2;
          attempt++
        ) {
          setStatus(
            '正在儲存到 GitHub...\n' +
            '第 ' +
            attempt +
            ' 次嘗試'
          );


          const response =
            await fetch(
              apiUrl,
              {
                method: 'PUT',

                headers: {
                  'Accept':
                    'application/vnd.github+json',

                  'Content-Type':
                    'application/json',

                  'Authorization':
                    'Bearer ' + token
                },

                body: JSON.stringify({
                  message:
                    'Update mozi.txt from web editor',

                  content:
                    encodedContent,

                  sha:
                    githubFile.sha,

                  branch:
                    GITHUB_BRANCH
                })
              }
            );


          const result =
            await response.json();


          if (response.ok) {
            setStatus(
              '儲存成功！\n' +
              'GitHub 已更新 mozi.txt。\n' +
              'Commit：' +
              result.commit.sha
            );


            /*
              GitHub 儲存成功後、
              清除本機暫存資料。
            */

            localStorage.removeItem(
              STORAGE_KEY
            );


            return;
          }


          const isShaConflict =
            response.status === 409 ||
            (
              result.message &&
              result.message.includes(
                'does not match'
              )
            );


          if (
            isShaConflict &&
            attempt === 1
          ) {
            setStatus(
              '檔案剛剛被修改、' +
              '正在取得最新 SHA 後重試...'
            );


            githubFile =
              await getGithubFile();


            continue;
          }


          throw new Error(
            result.message ||
            'GitHub 更新失敗、HTTP ' +
            response.status
          );
        }

      } catch (error) {
        setStatus(
          '儲存失敗：\n' +
          error.message
        );

      } finally {
        githubSaveButton.disabled =
          false;
      }
    }


    /*
      從 GitHub 讀取 mozi.txt
    */

    async function loadFromGithub() {
      const response =
        await fetch(
          'mozi.txt?t=' +
          Date.now(),
          {
            cache: 'no-store'
          }
        );


      if (!response.ok) {
        throw new Error(
          '無法讀取 mozi.txt、HTTP ' +
          response.status
        );
      }


      const text =
        await response.text();


      moziRows =
        parseMoziText(text);

      renderTable();
    }


    /*
      初始化
    */

    async function init() {
      loadToken();


      const hasLocalData =
        loadFromLocalStorage();


      if (hasLocalData) {
        renderTable();

        setStatus(
          '目前顯示的是本機暫存資料。'
        );

        return;
      }


      try {
        await loadFromGithub();

      } catch (error) {
        setStatus(
          '讀取 mozi.txt 失敗：\n' +
          error.message
        );
      }
    }


    /*
      綁定儲存按鈕
    */

    githubSaveButton.addEventListener(
      'click',
      saveToGithub
    );


    /*
      啟動
    */

    init();
  </script>

</body>

</html>
