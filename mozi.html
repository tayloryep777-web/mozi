<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>文字表格</title>

  <style>
    .character-row {
      margin-bottom: 8px;
      white-space: nowrap;
    }

    .character-row input {
      font-size: 16px;
      margin-left: 8px;
      box-sizing: border-box;
      padding: 2px 4px;
    }

    /*
      第一個輸入框：約 5 個漢字寬
    */
    .character-row input:first-of-type {
      width: 8em;
    }

    /*
      第二個輸入框：約 2 個漢字寬
    */
    .character-row input:last-of-type {
      width: 4em;
    }

    .toolbar {
      margin-bottom: 15px;
    }

    button {
      padding: 8px 14px;
      margin-right: 8px;
      cursor: pointer;
    }

    a {
      margin-right: 8px;
    }
  </style>
</head>

<body>

  <div class="toolbar">
    <button id="downloadButton">
      下載更新後的 mozi.txt
    </button>

    <button id="clearButton">
      清除本機保存資料
    </button>
  </div>

  <div id="content">
    正在載入 mozi.txt...
  </div>


  <script>
    /*
      所有資料儲存在這個陣列
    */
    let moziRows = [];


    /*
      localStorage 使用的名稱
    */
    const STORAGE_KEY = 'moziRows';


    /*
      固定分頁名稱

      字統永遠使用 zi_tools_tab
      訓詁永遠使用 kaom_tab
    */
    const ZI_TOOLS_TAB = 'zi_tools_tab';
    const KAOM_TAB = 'kaom_tab';


    /*
      開啟 zi.tools

      如果已經有 zi_tools_tab 分頁、
      就覆蓋該分頁。

      如果沒有、就建立新分頁。
    */
    function openZiTools(character) {
      const url =
        'https://zi.tools/zi/' +
        encodeURIComponent(character);

      const tab = window.open('', ZI_TOOLS_TAB);

      if (tab) {
        tab.location.href = url;
        tab.focus();
      }
    }


    /*
      kaom.net 訓詁查詢

      使用 POST 傳送漢字。
    */
    function searchKaom(word) {
  const form = document.createElement('form');

  form.method = 'POST';

  form.action =
    'http://www.kaom.net/book_xungu8.php';

  form.target = 'kaom_tab';


  // 漢字
  const input = document.createElement('input');

  input.type = 'hidden';
  input.name = 'word';
  input.value = word;


  // 簡繁、變體查詢
  const bianti = document.createElement('input');

  bianti.type = 'hidden';
  bianti.name = 'bianti';
  bianti.value = 'yes';


  // 頁碼設定
  const page = document.createElement('input');

  page.type = 'hidden';
  page.name = 'page';
  page.value = 'no';


  form.appendChild(input);
  form.appendChild(bianti);
  form.appendChild(page);

  document.body.appendChild(form);


  // 自動提交表單
  form.submit();


  // 移除暫時建立的表單
  form.remove();
}


    /*
      從 mozi.txt 載入資料
    */
    async function loadMozi() {
      try {
        const response = await fetch('mozi.txt');

        if (!response.ok) {
          throw new Error('找不到 mozi.txt');
        }

        const text = await response.text();


        /*
          每一行是一筆資料。

          空白行會被忽略。
        */
        const lines = text
          .split(/\r?\n/)
          .filter(line => line.trim() !== '');


        /*
          mozi.txt 格式：

          第一列：漢字
          第二列：第一個輸入框
          第三列：第二個輸入框

          三列之間使用 Tab 分隔。
        */
        moziRows = lines.map(function(line) {
          const columns = line.split('\t');

          return {
            character: columns[0] || '',
            second: columns[1] || '',
            third: columns[2] || ''
          };
        });


        /*
          讀取 localStorage。

          如果之前修改過資料、
          就使用本機保存的版本。
        */
        const savedData =
          localStorage.getItem(STORAGE_KEY);

        if (savedData) {
          try {
            const savedRows = JSON.parse(savedData);

            if (Array.isArray(savedRows)) {
              moziRows = savedRows;
            }

          } catch (error) {
            console.log(
              'localStorage 資料格式錯誤、改用 mozi.txt'
            );
          }
        }


        renderRows();

      } catch (error) {
        document.getElementById('content').textContent =
          '載入失敗：' + error.message;
      }
    }


    /*
      保存目前資料到 localStorage
    */
    function saveToLocalStorage() {
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(moziRows)
      );
    }


    /*
      顯示所有漢字資料
    */
    function renderRows() {
      const content =
        document.getElementById('content');

      content.innerHTML = '';


      moziRows.forEach(function(item, index) {
        const row = document.createElement('div');

        row.className = 'character-row';


        /*
          第一部分：普通漢字
        */
        const characterText =
          document.createTextNode(
            item.character + ' '
          );


        /*
          第二部分：字統

          固定顯示「字統」
          點擊後開啟 zi.tools
        */
        const toolsLink =
          document.createElement('a');

        toolsLink.href = '#';

        toolsLink.textContent = '字統';

        toolsLink.addEventListener(
          'click',
          function(event) {
            event.preventDefault();

            openZiTools(item.character);
          }
        );


        /*
          第三部分：訓詁

          固定顯示「訓詁」
          點擊後 POST 到 kaom.net
        */
        const kaomLink =
          document.createElement('a');

        kaomLink.href = '#';

        kaomLink.textContent = '訓詁';

        kaomLink.addEventListener(
          'click',
          function(event) {
            event.preventDefault();

            searchKaom(item.character);
          }
        );


        /*
          第一個輸入框：

          對應 mozi.txt 第二列
        */
        const input1 =
          document.createElement('input');

        input1.type = 'text';

        input1.value = item.second;

        input1.addEventListener(
          'input',
          function() {
            moziRows[index].second =
              input1.value;

            saveToLocalStorage();
          }
        );


        /*
          第二個輸入框：

          對應 mozi.txt 第三列
        */
        const input2 =
          document.createElement('input');

        input2.type = 'text';

        input2.value = item.third;

        input2.addEventListener(
          'input',
          function() {
            moziRows[index].third =
              input2.value;

            saveToLocalStorage();
          }
        );


        /*
          顯示順序：

          丈　字統　訓詁　[十又]　[丈]
        */
        row.appendChild(characterText);

        row.appendChild(toolsLink);

        row.appendChild(
          document.createTextNode(' ')
        );

        row.appendChild(kaomLink);

        row.appendChild(
          document.createTextNode(' ')
        );

        row.appendChild(input1);

        row.appendChild(input2);

        content.appendChild(row);
      });
    }


    /*
      下載更新後的 mozi.txt
    */
    function downloadMozi() {
      const text =
        moziRows.map(function(item) {
          return [
            item.character,
            item.second,
            item.third
          ].join('\t');
        }).join('\n');


      const blob =
        new Blob(
          [text],
          {
            type: 'text/plain;charset=utf-8'
          }
        );


      const url =
        URL.createObjectURL(blob);


      const link =
        document.createElement('a');

      link.href = url;

      link.download = 'mozi.txt';

      document.body.appendChild(link);

      link.click();

      link.remove();

      URL.revokeObjectURL(url);
    }


    /*
      清除 localStorage

      清除後重新讀取 GitHub 上的 mozi.txt。
    */
    function clearLocalStorage() {
      localStorage.removeItem(STORAGE_KEY);

      location.reload();
    }


    /*
      綁定下載按鈕
    */
    document
      .getElementById('downloadButton')
      .addEventListener(
        'click',
        downloadMozi
      );


    /*
      綁定清除按鈕
    */
    document
      .getElementById('clearButton')
      .addEventListener(
        'click',
        clearLocalStorage
      );


    /*
      啟動程式
    */
    loadMozi();
  </script>

</body>
</html>
