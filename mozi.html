<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>說文解字</title>
<style>
@font-face{font-family:"華瑞小篆體";src:url("華瑞小篆體.ttf")}
@font-face{font-family:"TW-MOE-Std-Kai";src:url("TW-MOE-Std-Kai.ttf")}
@font-face{font-family:"Shuo Wen SBIX";src:url("Shuo Wen SBIX.ttf") format("truetype")}
@font-face{font-family:"Shuo Wen CBDT";src:url("Shuo Wen CBDT.ttf") format("truetype")}
@font-face{font-family:"Jigmo";src:url("Jigmo.ttf")}
@font-face{font-family:"Jigmo2";src:url("Jigmo2.ttf")}
@font-face{font-family:"Jigmo3";src:url("Jigmo3.ttf")}
:is(#mozi,#cfa) td:nth-child(1),:is(#mozi,#cfa) td:nth-child(2){font:26pt "華瑞小篆體","Jigmo","Jigmo2","Jigmo3"}
:is(#mozi,#cfa) td:nth-child(3),:is(#mozi,#cfa) td:nth-child(4){font:24pt "TW-MOE-Std-Kai","Jigmo","Jigmo2","Jigmo3"}
:is(#mozi,#cfa) td:nth-child(5){font:26pt var(--shuowen),"Jigmo","Jigmo2","Jigmo3"}
:is(#mozi,#cfa) td:nth-child(6),:is(#mozi,#cfa) td:nth-child(7){font:22pt "Jigmo","Jigmo2","Jigmo3"}
:is(#mozi,#cfa) td:nth-child(-n+4){white-space:pre}
button,input{font:22pt "Jigmo","Jigmo2","Jigmo3"}
</style>
</head>
<body style="margin:0;height:100vh;display:flex;flex-direction:column;overflow:hidden">
<header style="flex-shrink:0;display:flex;flex-wrap:wrap">
<input id="cf" placeholder="搜尋" style="width:2ic">
<button id="cfb1">搜尋1</button><button id="cfb2">搜尋2</button><button id="cfb3">搜尋3</button>
<input id="cp" placeholder="取代" style="width:2ic"><button id="cpb">取代</button>
<button id="login">Google 登入</button><button id="pick">授權選取檔案</button><button id="cs">儲存</button>
<span id="status" role="status" style="font:14pt sans-serif;align-self:center"></span>
<div style="flex-basis:100%;max-height:25vh;min-width:0;overflow:auto"><table id="cfa"><col><col><col><col><col><col><col></table></div>
</header>
<main style="flex:1;min-height:0;overflow:auto"><table id="mozi"><col><col><col><col><col><col><col></table></main>
<footer style="height:25vh;flex-shrink:0;display:flex">
<p id="cmozi2" style="margin:0;white-space:pre;overflow-x:hidden;overflow-y:auto;min-width:8ic;font:26pt '華瑞小篆體','Jigmo','Jigmo2','Jigmo3'"></p>
<textarea id="mozi2" style="white-space:pre;overflow-x:hidden;overflow-y:auto;min-width:8ic;font:24pt 'TW-MOE-Std-Kai','Jigmo','Jigmo2','Jigmo3'"></textarea>
<p id="bg" style="margin:0;overflow-x:hidden;overflow-y:auto;font:22pt 'Jigmo','Jigmo2','Jigmo3'"></p>
</footer>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js" async defer></script>
<script>
'use strict';
const CLIENT_ID='417980776056-v7au2ne2dbv2ir74he61jkou7eqm4oj2.apps.googleusercontent.com';
const API_KEY='AIzaSyBG0kJgox2ZEkM59g8HDE5frivr9ocD-tI';
const APP_ID='417980776056';
const FILE_ID='1rl3lB4Tk3YzXsFnBvDHC4TmGFADhl1kh';
const SCOPE='https://www.googleapis.com/auth/drive.file';
const $=id=>document.getElementById(id);
const table=$('mozi'), cfa=$('cfa'), mozi2=$('mozi2'), cmozi2=$('cmozi2'), bg=$('bg');
let token='', tokenClient=null, pickerReady=false, loaded=false, dirty=false, loading=false;
let originalNewline='\n', originalBOM='', originalTrailingNewline=false;
const status=message=>{$('status').textContent=message};
const changed=()=>{dirty=true;status('尚未儲存')};
function updateBg(){
 const rows=[...table.rows],lines=mozi2.value.split('\n').map(s=>s.split('\t'));
 const a=rows.map(r=>r.cells[3].textContent).join('')+lines.map(r=>r[1]||'').join('');
 const b=rows.map(r=>r.cells[2].textContent).join('')+lines.map(r=>r[0]||'').join('');
 bg.textContent=[...new Set(a)].filter(c=>!b.includes(c)).join('');
}
function editable(td,tr){
 td.contentEditable='true';
 td.onkeydown=e=>{if(e.key==='Enter'||e.key==='Tab')e.preventDefault()};
 td.onpaste=e=>{
  e.preventDefault();
  const s=e.clipboardData.getData('text/plain').replace(/[\t\r\n]/g,'');
  document.execCommand('insertText',false,s);
 };
 td.oninput=()=>{
  const clean=td.textContent.replace(/[\t\r\n]/g,'');
  if(td.textContent!==clean)td.textContent=clean;
  tr.cells[1].textContent=td.textContent;
  updateBg();changed();
 };
}
function render(text,sw){
 originalBOM=text.startsWith('\uFEFF')?'\uFEFF':'';
 if(originalBOM)text=text.slice(1);
 originalNewline=text.includes('\r\n')?'\r\n':'\n';
 originalTrailingNewline=/\r?\n$/.test(text);
 const lines=text.replace(/\r\n/g,'\n').split('\n');
 const seals=sw.replace(/\r\n/g,'\n').split('\n');
 if(lines.length<9833||seals.length<9833)throw Error('資料不足 9833 行');
 const fragment=document.createDocumentFragment();
 for(let i=0;i<9833;i++){
  const m=lines[i].split('\t'),s=seals[i].split('\t');
  const tr=document.createElement('tr');
  [m[0]||'',m[1]||'',m[0]||'',m[1]||'',s[0]||'',s[1]||'',s[2]||''].forEach((v,j)=>{
   const td=tr.insertCell();td.textContent=v;
   if(j===3)editable(td,tr);
  });
  fragment.appendChild(tr);
 }
 table.querySelectorAll('tr').forEach(r=>r.remove());
 table.appendChild(fragment);
 cfa.querySelectorAll('tr').forEach(r=>r.remove());
 let tail=lines.slice(9833).join('\n');
 // 最後一個換行屬於檔案結尾、不是文字框的額外空白行。
 if(originalTrailingNewline&&tail.endsWith('\n'))tail=tail.slice(0,-1);
 mozi2.value=tail;cmozi2.textContent=tail;
 updateBg();loaded=true;dirty=false;status('已載入 mozi.txt');
}
async function driveRequest(url,options={}){
 if(!token)throw Error('請先登入 Google');
 const headers={Authorization:'Bearer '+token,...(options.headers||{})};
 const r=await fetch(url,{...options,headers});
 if(!r.ok){
  const detail=(await r.text()).slice(0,500);
  throw Error('Google Drive HTTP '+r.status+'：'+detail);
 }
 return r;
}
async function readDrive(){
 const r=await driveRequest('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(FILE_ID)+'?alt=media');
 return r.text();
}
async function writeDrive(text){
 await driveRequest('https://www.googleapis.com/upload/drive/v3/files/'+encodeURIComponent(FILE_ID)+'?uploadType=media',{
  method:'PATCH',headers:{'Content-Type':'text/plain;charset=utf-8'},body:text
 });
}
async function loadData(){
 if(loading)return;
 if(dirty&&!confirm('目前有尚未儲存的修改、確定重新載入？'))return;
 loading=true;status('正在載入…');
 try{
  const [text,sw]=await Promise.all([
   readDrive(),
   fetch('shuowen.txt').then(r=>{if(!r.ok)throw Error('shuowen.txt：HTTP '+r.status);return r.text()})
  ]);
  render(text,sw);
 }catch(e){console.error(e);status('載入失敗');alert(e.message+'\n若是 Drive 403 或 404、請先按「授權選取檔案」並選取指定的 mozi.txt。')}
 finally{loading=false}
}
function chooseFile(){
 if(!token){alert('請先登入 Google');return}
 if(!pickerReady){alert('Google Picker 尚未載入、請稍後重試');return}
 const view=new google.picker.DocsView().setMimeTypes('text/plain').setIncludeFolders(true);
 const picker=new google.picker.PickerBuilder()
  .addView(view).setOAuthToken(token).setDeveloperKey(API_KEY).setAppId(APP_ID)
  .setCallback(async data=>{
   if(data.action!==google.picker.Action.PICKED)return;
   const picked=data.docs?.[0];
   if(!picked)return;
   if(picked.id!==FILE_ID){alert('這不是指定的 mozi.txt、請選取正確的 Google Drive 檔案。');return}
   await loadData();
  }).build();
 picker.setVisible(true);
}
function loginDrive(prompt=''){
 if(!window.google?.accounts?.oauth2){status('Google OAuth 尚未載入');return}
 if(!tokenClient){
  tokenClient=google.accounts.oauth2.initTokenClient({
   client_id:CLIENT_ID,scope:SCOPE,
   callback:async response=>{
    if(response.error){status('Drive 授權需要重新操作');console.warn(response);return}
    token=response.access_token;
    status('Drive 已授權');
    if(!loaded||!dirty)await loadData();
   },
   error_callback:error=>{console.warn('Drive OAuth：',error);status('請按「Google 登入」重新授權 Drive')}
  });
 }
 tokenClient.requestAccessToken({prompt});
}
$('login').onclick=()=>loginDrive('');
$('pick').onclick=chooseFile;
function waitForPicker(){
 if(window.gapi?.load){gapi.load('picker',()=>{pickerReady=true});return}
 setTimeout(waitForPicker,250);
}
waitForPicker();
mozi2.oninput=()=>{cmozi2.textContent=mozi2.value;updateBg();changed()};
mozi2.onscroll=()=>{cmozi2.scrollTop=mozi2.scrollTop;cmozi2.scrollLeft=mozi2.scrollLeft};
cmozi2.onscroll=()=>{mozi2.scrollTop=cmozi2.scrollTop;mozi2.scrollLeft=cmozi2.scrollLeft};
function searchColumn(n){
 cfa.querySelectorAll('tr').forEach(r=>r.remove());
 const q=$('cf').value;if(!q)return;
 const fragment=document.createDocumentFragment();
 [...table.rows].forEach(tr=>{
  if(!tr.cells[n-1].textContent.includes(q))return;
  const row=document.createElement('tr');
  [...tr.cells].forEach(td=>{row.insertCell().textContent=td.textContent});
  row.onclick=()=>tr.scrollIntoView({behavior:'smooth',block:'center'});
  fragment.appendChild(row);
 });
 cfa.appendChild(fragment);
}
$('cfb1').onclick=()=>searchColumn(3);
$('cfb2').onclick=()=>searchColumn(4);
$('cfb3').onclick=()=>searchColumn(6);
$('cpb').onclick=()=>{
 const q=$('cf').value;if(!q)return;
 const replacement=$('cp').value.replace(/[\t\r\n]/g,'');
 let any=false;
 [...table.rows].forEach(tr=>{
  const td=tr.cells[3];
  if(td.textContent.includes(q)){
   td.textContent=td.textContent.replaceAll(q,replacement);
   tr.cells[1].textContent=td.textContent;any=true;
  }
 });
 if(any){updateBg();changed()}
};
$('cs').onclick=async()=>{
 if(!token||!loaded){alert('請先登入並載入 mozi.txt');return}
 const head=[...table.rows].map(tr=>[tr.cells[2].textContent,tr.cells[3].textContent].join('\t')).join('\n');
 let content=head+'\n'+mozi2.value;
 if(originalTrailingNewline&&!content.endsWith('\n'))content+='\n';
 content=originalBOM+content.replace(/\n/g,originalNewline);
 $('cs').disabled=true;status('正在儲存…');
 try{await writeDrive(content);dirty=false;status('已儲存至 Google Drive')}
 catch(e){console.error(e);status('儲存失敗');alert(e.message)}
 finally{$('cs').disabled=false}
};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
const apple=/iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent)||
 (navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
document.documentElement.style.setProperty('--shuowen',apple?'"Shuo Wen SBIX"':'"Shuo Wen CBDT"');
</script>

</body>
</html>
