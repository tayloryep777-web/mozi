
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>說文解字</title>
<style>
@font-face{font-family:"華瑞小篆體";src:url("華瑞小篆體.ttf")}
@font-face{font-family:"TW-MOE-Std-Kai";src:url("TW-MOE-Std-Kai.ttf")}
@font-face{font-family:"Shuo Wen SBIX";src:url("Shuo Wen SBIX.ttf")}
@font-face{font-family:"Shuo Wen CBDT";src:url("Shuo Wen CBDT.ttf")}
@font-face{font-family:"Jigmo";src:url("Jigmo.ttf")}
@font-face{font-family:"Jigmo2";src:url("Jigmo2.ttf")}
@font-face{font-family:"Jigmo3";src:url("Jigmo3.ttf")}

:is(#mozi,#cfa) td:nth-child(-n+2){
 font:26pt "華瑞小篆體","Jigmo","Jigmo2","Jigmo3"
}
:is(#mozi,#cfa) td:nth-child(3),
:is(#mozi,#cfa) td:nth-child(4){
 font:24pt "TW-MOE-Std-Kai","Jigmo","Jigmo2","Jigmo3"
}
:is(#mozi,#cfa) td:nth-child(5){
 font:26pt var(--shuowen),"Jigmo","Jigmo2","Jigmo3"
}
:is(#mozi,#cfa) td:nth-child(n+6){
 font:22pt "Jigmo","Jigmo2","Jigmo3"
}
:is(#mozi,#cfa) td:nth-child(-n+4){white-space:pre}

button,input{font:22pt "Jigmo","Jigmo2","Jigmo3"}

.char{
 font:inherit;
 border:0;
 padding:0;
 margin:0;
 background:transparent;
 cursor:pointer;
 touch-action:manipulation;
 user-select:none;
 -webkit-user-select:none;
}
.char:active{background:#ddd}

#mozi td:nth-child(n+2):nth-child(-n+4){
 min-width:2ic;
}
#cfa tr{cursor:pointer}
</style>
</head>

<body style="margin:0;height:100vh;display:flex;flex-direction:column;overflow:hidden">

<header style="flex-shrink:0;display:flex;flex-wrap:wrap;align-items:center">
 <button id="cf" class="char" style="min-width:2ic">＋</button>
 <button id="cfb1">搜尋1</button>
 <button id="cfb2">搜尋2</button>
 <button id="cfb3">搜尋3</button>
 <button id="cp" class="char" style="min-width:2ic">＋</button>
 <button id="cpb">取代</button>
 <button id="reload">重新載入</button>
 <button id="cs">儲存至 GitHub</button>
 <span id="status" role="status" style="font:14pt sans-serif;align-self:center"></span>

 <div style="flex-basis:100%;max-height:25vh;min-width:0;overflow:auto">
  <table id="cfa">
   <col><col><col><col><col><col><col>
  </table>
 </div>
</header>

<main style="flex:1;min-height:0;overflow:auto">
 <table id="mozi">
  <col><col><col><col><col><col><col>
 </table>
</main>

<footer style="height:25vh;flex-shrink:0;display:flex">
 <p id="cmozi2" style="margin:0;white-space:pre;overflow-x:hidden;overflow-y:auto;min-width:8ic;font:26pt '華瑞小篆體','Jigmo','Jigmo2','Jigmo3'"></p>
 <textarea id="mozi2" style="white-space:pre;overflow-x:hidden;overflow-y:auto;min-width:8ic;font:24pt 'TW-MOE-Std-Kai','Jigmo','Jigmo2','Jigmo3'"></textarea>
 <p id="bg" style="margin:0;overflow-x:hidden;overflow-y:auto;font:22pt 'Jigmo','Jigmo2','Jigmo3'"></p>
</footer>

<script>
'use strict';

const API='https://api.github.com/repos/tayloryep777-web/mozi/contents/mozi.txt';
const BRANCH='mozi';

const $=id=>document.getElementById(id);
const table=$('mozi'),cfa=$('cfa');
const mozi2=$('mozi2'),cmozi2=$('cmozi2'),bg=$('bg');

let sha='',loaded=false,dirty=false,loading=false;
let originalNewline='\n',originalBOM='',originalTrailingNewline=false;

const status=s=>{$('status').textContent=s};
const changed=()=>{dirty=true;status('尚未儲存')};

// Unicode 字元處理
const chars=s=>Array.from(s);

// 只取第一個非空白 Unicode 字元
const first=s=>chars(s).find(c=>!/\s/u.test(c))||'';

// Base64 UTF-8
const decode=s=>new TextDecoder().decode(
 Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0))
);

const encode=s=>{
 const bytes=new TextEncoder().encode(s);
 let binary='';
 for(let i=0;i<bytes.length;i+=8192)
  binary+=String.fromCharCode(...bytes.subarray(i,i+8192));
 return btoa(binary);
};

// 剪貼簿
async function copyText(s){
 if(!s)return;
 try{
  await navigator.clipboard.writeText(s);
  status('已複製：'+s);
 }catch(e){
  console.error(e);
  status('複製失敗');
 }
}

async function pasteChar(){
 try{
  return first(await navigator.clipboard.readText());
 }catch(e){
  console.error(e);
  status('無法讀取剪貼簿');
  return null;
 }
}

// 取得按鈕或表格儲存值
function value(el){
 return el.dataset.value??el.textContent;
}

// 第 1 欄即時同步第 2、3、4 欄
function updateFirst(tr){
 tr.cells[0].textContent=[1,2,3].map(i=>value(tr.cells[i])).join('');
}

// 差異計算
function updateBg(){
 const rows=[...table.rows];
 const lines=mozi2.value.split('\n').map(s=>s.split('\t'));

 const a=rows.map(r=>value(r.cells[3])).join('')+
         lines.map(r=>r[1]||'').join('');

 const b=rows.map(r=>value(r.cells[2])).join('')+
         lines.map(r=>r[0]||'').join('');

 bg.textContent=[...new Set(a)].filter(c=>!b.includes(c)).join('');
}

// 統一建立單字按鈕
function makeButton(button,get,set){
 let timer=null;
 let longPressed=false;
 let startX=0,startY=0;

 const stop=()=>{
  if(timer!==null){
   clearTimeout(timer);
   timer=null;
  }
 };

 button.classList.add('char');
 button.type='button';

 button.addEventListener('pointerdown',e=>{
  if(e.button!==0)return;

  longPressed=false;
  startX=e.clientX;
  startY=e.clientY;
  stop();

  if(get()){
   timer=setTimeout(()=>{
    timer=null;
    longPressed=true;
    set('');
    status('已清空');
   },600);
  }
 });

 button.addEventListener('pointermove',e=>{
  if(Math.hypot(e.clientX-startX,e.clientY-startY)>10)
   stop();
 });

 button.addEventListener('pointerup',stop);
 button.addEventListener('pointercancel',stop);
 button.addEventListener('pointerleave',stop);

 button.addEventListener('contextmenu',e=>e.preventDefault());

 button.addEventListener('click',async()=>{
  if(longPressed){
   longPressed=false;
   return;
  }

  const current=get();

  if(current){
   await copyText(current);
  }else{
   const s=await pasteChar();
   if(s===null||!s)return;
   set(s);
  }
 });
}

// 搜尋及取代按鈕
function setupControl(id){
 const button=$(id);
 let current='';

 function set(s){
  current=s;
  button.textContent=s||'＋';
  button.dataset.value=s;
 }

 set('');
 makeButton(button,()=>current,set);

 return ()=>current;
}

const getSearch=setupControl('cf');
const getReplace=setupControl('cp');

// 表格第 2、3、4 欄：單字按鈕
function setCell(td,s,notify=false){
 s=first(s);
 td.dataset.value=s;
 td.replaceChildren();

 const button=document.createElement('button');
 button.textContent=s||'＋';
 button.title=s?'點擊複製、長按清空':'點擊貼上';

 td.appendChild(button);

 const tr=td.parentElement;

 makeButton(button,
  ()=>value(td),
  next=>setCell(td,next,true)
 );

 if(tr.cells.length>=4){
  updateFirst(tr);
 }

 if(notify){
  updateBg();
  changed();
 }
}

// 載入並建立表格
function render(text,sw){
 originalBOM=text.startsWith('\uFEFF')?'\uFEFF':'';
 if(originalBOM)text=text.slice(1);

 originalNewline=text.includes('\r\n')?'\r\n':'\n';
 originalTrailingNewline=/\r?\n$/.test(text);

 const lines=text.replace(/\r\n/g,'\n').split('\n');
 const seals=sw.replace(/\r\n/g,'\n').split('\n');

 if(lines.length<9833||seals.length<9833)
  throw Error('資料不足 9833 行');

 const fragment=document.createDocumentFragment();

 for(let i=0;i<9833;i++){
  const m=chars(lines[i]).slice(0,3);
  const s=seals[i].split('\t');
  const tr=document.createElement('tr');

  // 第 1 欄：第 2、3、4 欄的組合
  tr.insertCell();

  // 第 2、3、4 欄：mozi.txt 每行前三字
  for(let j=0;j<3;j++){
   const td=tr.insertCell();
   setCell(td,m[j]||'');
  }

  // 第 5、6、7 欄：shuowen.txt
  for(let j=0;j<3;j++){
   tr.insertCell().textContent=s[j]||'';
  }

  fragment.appendChild(tr);
 }

 table.querySelectorAll('tr').forEach(r=>r.remove());
 table.appendChild(fragment);
 cfa.querySelectorAll('tr').forEach(r=>r.remove());

 let tail=lines.slice(9833).join('\n');
 if(originalTrailingNewline&&tail.endsWith('\n'))
  tail=tail.slice(0,-1);

 mozi2.value=tail;
 cmozi2.textContent=tail;

 updateBg();
 loaded=true;
 dirty=false;
 status('已載入 mozi.txt');
}

// GitHub API
async function github(options={}){
 const r=await fetch(API+'?ref='+BRANCH,{
  cache:'no-store',
  ...options,
  headers:{
   Accept:'application/vnd.github+json',
   ...(options.headers||{})
  }
 });

 if(!r.ok)
  throw Error('GitHub HTTP '+r.status+'：'+(await r.text()).slice(0,400));

 return r.json();
}

async function loadData(){
 if(loading||dirty&&!confirm('有尚未儲存的修改、確定重新載入？'))
  return;

 loading=true;
 status('正在載入…');

 try{
  const [file,sw]=await Promise.all([
   github(),
   fetch('shuowen.txt').then(r=>{
    if(!r.ok)throw Error('shuowen.txt HTTP '+r.status);
    return r.text();
   })
  ]);

  render(decode(file.content),sw);
  sha=file.sha;

 }catch(e){
  console.error(e);
  status('載入失敗');
  alert(e.message);
 }finally{
  loading=false;
 }
}

$('reload').onclick=loadData;

// 底部文字同步
mozi2.oninput=()=>{
 cmozi2.textContent=mozi2.value;
 updateBg();
 changed();
};

mozi2.onscroll=()=>{
 cmozi2.scrollTop=mozi2.scrollTop;
 cmozi2.scrollLeft=mozi2.scrollLeft;
};

cmozi2.onscroll=()=>{
 mozi2.scrollTop=cmozi2.scrollTop;
 mozi2.scrollLeft=cmozi2.scrollLeft;
};

// 點擊一般文字複製單一 Unicode 字元
document.addEventListener('click',async e=>{
 if(e.target.closest('button,input,textarea,[contenteditable]'))
  return;

 const el=e.target.closest('td,p,span');
 if(!el)return;

 const selection=window.getSelection();
 if(selection&&!selection.isCollapsed)return;

 let node=null,offset=0;

 if(document.caretPositionFromPoint){
  const pos=document.caretPositionFromPoint(e.clientX,e.clientY);
  if(pos){
   node=pos.offsetNode;
   offset=pos.offset;
  }
 }else if(document.caretRangeFromPoint){
  const pos=document.caretRangeFromPoint(e.clientX,e.clientY);
  if(pos){
   node=pos.startContainer;
   offset=pos.startOffset;
  }
 }

 if(!node||node.nodeType!==Node.TEXT_NODE)return;
 if(!el.contains(node))return;

 const s=node.textContent;
 const before=chars(s.slice(0,offset)).length;
 const c=chars(s)[before]||chars(s)[before-1]||'';

 if(c)await copyText(c);
});

// 搜尋
function searchColumn(n){
 cfa.querySelectorAll('tr').forEach(r=>r.remove());

 const q=getSearch();
 if(!q)return;

 const fragment=document.createDocumentFragment();

 [...table.rows].forEach(tr=>{
  if(!value(tr.cells[n-1]).includes(q))return;

  const row=document.createElement('tr');

  [...tr.cells].forEach(td=>{
   row.insertCell().textContent=value(td);
  });

  row.onclick=()=>{
   tr.scrollIntoView({behavior:'smooth',block:'center'});
  };

  fragment.appendChild(row);
 });

 cfa.appendChild(fragment);
}

// 搜尋第 2、3、4 欄
$('cfb1').onclick=()=>searchColumn(2);
$('cfb2').onclick=()=>searchColumn(3);
$('cfb3').onclick=()=>searchColumn(4);

// 取代第 2、3、4 欄
$('cpb').onclick=()=>{
 const q=getSearch();
 if(!q)return;

 const replacement=getReplace();
 let any=false;

 [...table.rows].forEach(tr=>{
  for(const j of [1,2,3]){
   const td=tr.cells[j];

   if(value(td)===q){
    setCell(td,replacement);
    any=true;
   }
  }
 });

 if(any){
  updateBg();
  changed();
  status('取代完成');
 }
};

// 儲存 GitHub
$('cs').onclick=async()=>{
 if(!loaded){
  alert('請先載入 mozi.txt');
  return;
 }

 // 每行直接串接第 2、3、4 欄，不使用 Tab
 const head=[...table.rows].map(tr=>
  [1,2,3].map(j=>value(tr.cells[j])).join('')
 ).join('\n');

 let content=head+'\n'+mozi2.value;

 if(originalTrailingNewline&&!content.endsWith('\n'))
  content+='\n';

 content=originalBOM+content.replace(/\n/g,originalNewline);

 $('cs').disabled=true;
 status('正在儲存…');

 try{
  const token=prompt(
   '輸入 GitHub Fine-grained PAT（mozi 儲存庫 Contents: Read and write）。Token 不會儲存在網頁中：'
  );

  if(!token){
   status('已取消儲存');
   return;
  }

  const result=await github({
   method:'PUT',
   headers:{
    Authorization:'Bearer '+token,
    'Content-Type':'application/json'
   },
   body:JSON.stringify({
    message:'更新 mozi.txt',
    content:encode(content),
    sha,
    branch:BRANCH
   })
  });

  sha=result.content.sha;
  dirty=false;
  status('已提交至 GitHub mozi 分支');

 }catch(e){
  console.error(e);
  status('儲存失敗');
  alert(e.message);
 }finally{
  $('cs').disabled=false;
 }
};

// 防止未儲存就離開
window.addEventListener('beforeunload',e=>{
 if(dirty){
  e.preventDefault();
  e.returnValue='';
 }
});

// Apple 使用 SBIX，其他平台使用 CBDT
const apple=/iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent)||
 (navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);

document.documentElement.style.setProperty(
 '--shuowen',
 apple?'"Shuo Wen SBIX"':'"Shuo Wen CBDT"'
);

loadData();
</script>
</body>
</html>
