/* ==================== 載入畫面 ==================== */

#loading{

}

}

<script type="module">
'use strict';

/* ==================== 設定 ==================== */

const API='https://api.github.com/repos/tayloryep777-web/mozi/contents/mozi.txt';
const BRANCH='mozi';
const TOTAL=9833;

const ROW_HEIGHT=56;
const OVERSCAN=20;
const SEARCH_PAGE=100;

const $=id=>document.getElementById(id);

const table=$('mozi');
const cfa=$('cfa');
const mozi2=$('mozi2');
const bg=$('bg');
const viewport=$('viewport');

const mainBody=$('mozi-body');
const searchBody=$('cfa-body');
const extraBody=$('mozi2-body');

const tokenInput=$('token');

const chars=s=>Array.from(s);

const first=s=>chars(s).find(
 c=>!(/[\p{White_Space}\p{Cc}\p{Cf}]/u.test(c))
)||'';

const status=s=>{
 $('status').textContent=s;
};

const nextFrame=()=>new Promise(resolve=>{
 requestAnimationFrame(resolve);
});

/* ==================== 狀態 ==================== */

let sha='';
let loaded=false;
let dirty=false;
let loading=false;
let saving=false;
let clipboard='';

let originalNewline='\n';
let originalBOM='';
let originalTrailingNewline=false;

let mainData=[];
let extraData=[];

let renderedStart=-1;
let renderedEnd=-1;
let renderPending=false;
let highlightedIndex=-1;

let searchMatches=[];

let pressTimer=null;
let pressButton=null;
let pressX=0;
let pressY=0;
let longPressed=false;

/* ==================== 平台字型 ==================== */

const apple=/iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent)||
 (navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);

const sealFamily=apple?'Shuo Wen SBIX':'Shuo Wen CBDT';

document.documentElement.style.setProperty(
 '--shuowen',
 JSON.stringify(sealFamily)
);

/* ==================== 載入畫面 ==================== */

function progress(p,stage,detail=''){
 $('loading-bar').value=Math.max(0,Math.min(100,p));
 $('loading-stage').textContent=stage;
 $('loading-detail').textContent=
  `${p.toFixed(1)}%${detail?' · '+detail:''}`;
}

function showLoading(){
 document.body.classList.remove('ready');
 $('loading').hidden=false;
 $('loading-error').textContent='';
 $('retry').hidden=true;
 progress(0,'準備載入…');
}

function failLoading(e){
 console.error(e);

 progress(
  $('loading-bar').value,
  '載入失敗'
 );

 $('loading-error').textContent=e.message||String(e);
 $('retry').hidden=false;

 status('載入失敗：'+(e.message||String(e)));
}

function finishLoading(){
 document.body.classList.add('ready');

 requestAnimationFrame(()=>{
  renderedStart=-1;
  renderedEnd=-1;

  renderVisible(true);

  $('loading').hidden=true;
  progress(100,'全部載入完成');
 });
}

function changed(){
 dirty=true;
 status('尚未儲存');
}

/* ==================== Token ==================== */

try{
 tokenInput.value=
  localStorage.getItem('mozi-github-token')||'';
}catch(e){
 console.error(e);
}

tokenInput.addEventListener('input',()=>{
 try{
  localStorage.setItem(
   'mozi-github-token',
   tokenInput.value
  );
 }catch(e){
  console.error(e);
  status('瀏覽器無法儲存 Token');
 }
});

/* ==================== 編碼 ==================== */

const decode=s=>new TextDecoder().decode(
 Uint8Array.from(
  atob(s.replace(/\s/g,'')),
  c=>c.charCodeAt(0)
 )
);

const encode=s=>{
 const bytes=new TextEncoder().encode(s);
 let binary='';

 for(let i=0;i<bytes.length;i+=8192){
  binary+=String.fromCharCode(
   ...bytes.subarray(i,i+8192)
  );
 }

 return btoa(binary);
};

/* ==================== 複製與貼上 ==================== */

async function copy(s){
 if(!s)return;

 clipboard=s;

 try{
  await navigator.clipboard.writeText(s);
 }catch(e){
  console.error(e);
 }

 status('已複製：'+s);
}

async function paste(){
 try{
  return first(
   await navigator.clipboard.readText()
  );
 }catch(e){
  console.error(e);
  status('無法讀取系統剪貼簿');
  return null;
 }
}

/* ==================== 建立字元按鈕 ==================== */

function charButtons(el,s,prefix){
 const fragment=document.createDocumentFragment();

 let index=0;

 for(const c of chars(s)){
  const b=document.createElement('button');

  b.id=prefix+'-char-'+index;
  b.type='button';
  b.className='char';
  b.textContent=c;
  b.dataset.copy=c;

  fragment.appendChild(b);
  index++;
 }

 el.replaceChildren(fragment);
}

function editableButton(el){
 el.classList.add('char');
 el.type='button';
 el.dataset.edit='1';
}

function createEditableButton(s,kind,index,column){
 const b=document.createElement('button');

 b.id=kind+'-edit-'+index+'-'+column;

 editableButton(b);

 b.textContent=s;
 b.dataset.value=s;
 b.dataset.kind=kind;
 b.dataset.index=index;
 b.dataset.column=column;

 return b;
}

/* ==================== 搜尋與取代輸入 ==================== */

function control(id){
 const el=$(id);

 editableButton(el);

 el.dataset.kind='control';
 el.dataset.value='';

 return ()=>el.dataset.value||'';
}

const getSearch=control('cf');
const getReplace=control('cp');

/* ==================== 資料存取 ==================== */

function getEditValue(kind,index,column){
 if(kind==='main'){
  return mainData[index]?.edit[column]??'';
 }

 if(kind==='extra'){
  return extraData[index]?.[column]??'';
 }

 return '';
}

function setEditValue(kind,index,column,s){
 s=first(s);

 if(kind==='main'){
  if(!mainData[index])return;
  mainData[index].edit[column]=s;
 }else if(kind==='extra'){
  if(!extraData[index])return;
  extraData[index][column]=s;
 }else{
  return;
 }

 changed();
 updateBg();

 if(kind==='main'){
  refreshVisibleRow(index);
 }else{
  renderExtra();
 }
}

function updateFirst(tr,edit,prefix){
 charButtons(
  tr.cells[0],
  edit.join(''),
  prefix+'-first'
 );
}

/* ==================== 按鈕複製 ==================== */

document.addEventListener('click',e=>{
 const b=e.target.closest('button[data-copy]');

 if(b){
  copy(b.dataset.copy);
 }
});

/* ==================== 長按操作 ==================== */

function stopPress(){
 clearTimeout(pressTimer);
 pressTimer=null;
}

document.addEventListener('pointerdown',e=>{
 const b=e.target.closest('button[data-edit]');

 if(!b||e.button!==0)return;

 stopPress();

 pressButton=b;
 pressX=e.clientX;
 pressY=e.clientY;
 longPressed=false;

 const kind=b.dataset.kind;
 const index=Number(b.dataset.index);
 const column=Number(b.dataset.column);

 pressTimer=setTimeout(async()=>{
  if(pressButton!==b)return;

  longPressed=true;

  if(kind==='control'){
   const s=b.dataset.value||'';

   if(s){
    b.dataset.value='';
    b.textContent='';
    status('已清空');
   }else{
    const p=await paste();

    if(p){
     b.dataset.value=p;
     b.textContent=p;
    }
   }

   return;
  }

  const s=getEditValue(kind,index,column);

  if(s){
   setEditValue(kind,index,column,'');
   status('已清空');
  }else{
   const p=await paste();

   if(p){
    setEditValue(kind,index,column,p);
   }
  }
 },600);
});

document.addEventListener('pointermove',e=>{
 if(
  pressButton&&
  Math.hypot(
   e.clientX-pressX,
   e.clientY-pressY
  )>10
 ){
  stopPress();
 }
});

document.addEventListener('pointerup',stopPress);
document.addEventListener('pointercancel',stopPress);

document.addEventListener('contextmenu',e=>{
 if(e.target.closest('button[data-edit]')){
  e.preventDefault();
 }
});

/* ==================== 單擊操作 ==================== */

document.addEventListener('click',e=>{
 const b=e.target.closest('button[data-edit]');

 if(!b)return;

 if(longPressed){
  longPressed=false;
  pressButton=null;
  return;
 }

 pressButton=null;

 const kind=b.dataset.kind;

 if(kind==='control'){
  const s=b.dataset.value||'';

  if(s){
   copy(s);
  }else if(clipboard){
   const v=first(clipboard);

   b.dataset.value=v;
   b.textContent=v;
  }else{
   status('網頁內部剪貼簿為空');
  }

  return;
 }

 const index=Number(b.dataset.index);
 const column=Number(b.dataset.column);

 const s=getEditValue(kind,index,column);

 if(s){
  copy(s);
 }else if(clipboard){
  setEditValue(kind,index,column,clipboard);
 }else{
  status('網頁內部剪貼簿為空');
 }
});

/* ==================== 建立主表行 ==================== */

function createMainRow(index){
 const data=mainData[index];
 const tr=document.createElement('tr');

 tr.id='main-row-'+index;
 tr.className='data-row';
 tr.dataset.index=index;

 for(let j=0;j<7;j++){
  const td=tr.insertCell();
  td.id='main-cell-'+index+'-'+j;
 }

 for(let j=0;j<3;j++){
  tr.cells[j+1].appendChild(
   createEditableButton(
    data.edit[j],
    'main',
    index,
    j
   )
  );
 }

 updateFirst(
  tr,
  data.edit,
  'main-'+index
 );

 for(let j=0;j<3;j++){
  charButtons(
   tr.cells[j+4],
   data.seal[j]||'',
   'main-'+index+'-seal-'+j
  );
 }

 if(index===highlightedIndex){
  tr.classList.add('highlight');
 }

 return tr;
}

/* ==================== 虛擬捲動佔位 ==================== */

function createSpacer(height,position){
 const tr=document.createElement('tr');

 tr.id='main-spacer-'+position;
 tr.className='spacer';

 const td=tr.insertCell();

 td.id='main-spacer-cell-'+position;
 td.colSpan=7;

 td.style.height=height+'px';
 td.style.minHeight=height+'px';

 return tr;
}

/* ==================== 虛擬捲動 ==================== */

function renderVisible(force=false){
 if(!loaded)return;

 const scrollTop=viewport.scrollTop;
 const viewportHeight=viewport.clientHeight;

 const firstVisible=Math.floor(
  scrollTop/ROW_HEIGHT
 );

 const start=Math.max(
  0,
  firstVisible-OVERSCAN
 );

 const visibleCount=Math.ceil(
  viewportHeight/ROW_HEIGHT
 );

 const end=Math.min(
  mainData.length,
  firstVisible+visibleCount+OVERSCAN
 );

 if(
  !force&&
  start===renderedStart&&
  end===renderedEnd
 ){
  return;
 }

 const fragment=document.createDocumentFragment();

 const topHeight=start*ROW_HEIGHT;
 const bottomHeight=
  (mainData.length-end)*ROW_HEIGHT;

 if(topHeight>0){
  fragment.appendChild(
   createSpacer(topHeight,'top')
  );
 }

 for(let i=start;i<end;i++){
  fragment.appendChild(
   createMainRow(i)
  );
 }

 if(bottomHeight>0){
  fragment.appendChild(
   createSpacer(bottomHeight,'bottom')
  );
 }

 mainBody.replaceChildren(fragment);

 renderedStart=start;
 renderedEnd=end;

 $('position').textContent=
  `${Math.min(firstVisible+1,TOTAL)} / ${TOTAL}`;
}

function scheduleRender(){
 if(renderPending)return;

 renderPending=true;

 requestAnimationFrame(()=>{
  renderPending=false;
  renderVisible();
 });
}

viewport.addEventListener(
 'scroll',
 scheduleRender,
 {passive:true}
);

window.addEventListener(
 'resize',
 scheduleRender
);

function refreshVisibleRow(index){
 if(
  index<renderedStart||
  index>=renderedEnd
 ){
  return;
 }

 const tr=$('main-row-'+index);

 if(tr){
  tr.replaceWith(
   createMainRow(index)
  );
 }
}

function jumpToRow(index){
 if(index<0||index>=mainData.length)return;

 highlightedIndex=index;

 const top=index*ROW_HEIGHT;

 viewport.scrollTop=Math.max(
  0,
  top-(viewport.clientHeight-ROW_HEIGHT)/2
 );

 renderVisible(true);

 status(`已跳至第 ${index+1} 行`);
}

/* ==================== 附加資料 ==================== */

function createExtraRow(index){
 const data=extraData[index];
 const tr=document.createElement('tr');

 tr.id='extra-row-'+index;
 tr.dataset.index=index;

 for(let j=0;j<6;j++){
  const td=tr.insertCell();
  td.id='extra-cell-'+index+'-'+j;
 }

 for(let j=0;j<3;j++){
  tr.cells[j+1].appendChild(
   createEditableButton(
    data[j],
    'extra',
    index,
    j
   )
  );
 }

 updateFirst(
  tr,
  data,
  'extra-'+index
 );

 for(const [symbol,direction] of [['↑',-1],['↓',1]]){
  const column=direction<0?4:5;
  const td=tr.cells[column];

  const b=document.createElement('button');

  b.id='extra-move-'+index+'-'+column;
  b.type='button';
  b.textContent=symbol;
  b.title=direction<0?'上移一行':'下移一行';

  b.addEventListener('click',()=>{
   moveExtraRow(index,direction);
  });

  td.appendChild(b);
 }

 return tr;
}

function renderExtra(){
 const fragment=document.createDocumentFragment();

 for(let i=0;i<extraData.length;i++){
  fragment.appendChild(
   createExtraRow(i)
  );
 }

 const tr=document.createElement('tr');

 tr.id='extra-add-row';
 tr.className='add-row';
 tr.dataset.add='1';

 const td=tr.insertCell();

 td.id='extra-add-cell';
 td.colSpan=6;

 const b=document.createElement('button');

 b.id='extra-add-button';
 b.type='button';
 b.textContent='＋';
 b.title='新增一行';

 b.addEventListener('click',()=>{
  extraData.push(['','','']);

  renderExtra();
  updateBg();
  changed();
 });

 td.appendChild(b);
 fragment.appendChild(tr);

 extraBody.replaceChildren(fragment);
}

function moveExtraRow(index,direction){
 const target=index+direction;

 if(
  target<0||
  target>=extraData.length
 ){
  return;
 }

 [extraData[index],extraData[target]]=
 [extraData[target],extraData[index]];

 renderExtra();
 changed();
}

/* ==================== 差異字元 ==================== */

function updateBg(){
 const a=new Set();
 const b=new Set();

 for(const row of mainData){
  for(const c of chars(row.edit[0])){
   a.add(c);
  }

  for(const c of chars(
   row.edit[1]+row.edit[2]
  )){
   b.add(c);
  }
 }

 for(const row of extraData){
  for(const c of chars(row[0])){
   a.add(c);
  }

  for(const c of chars(row[1]+row[2])){
   b.add(c);
  }
 }

 charButtons(
  bg,
  [...b].filter(c=>!a.has(c)).join(''),
  'bg'
 );
}

/* ==================== 搜尋資料 ==================== */

function rowValues(data){
 return [
  data.edit.join(''),
  ...data.edit,
  ...data.seal
 ];
}

function searchColumn(columns){
 searchBody.replaceChildren();

 const q=getSearch();

 if(!q)return;

 searchMatches=[];

 for(let i=0;i<mainData.length;i++){
  const cells=rowValues(mainData[i]);

  if(columns.some(
   n=>cells[n-1].includes(q)
  )){
   searchMatches.push(i);
  }
 }

 renderSearchResults(0);

 status(`找到 ${searchMatches.length} 行`);
}

/* ==================== 搜尋結果 ==================== */

function renderSearchResults(offset){
 const fragment=document.createDocumentFragment();

 const end=Math.min(
  offset+SEARCH_PAGE,
  searchMatches.length
 );

 for(let k=offset;k<end;k++){
  const index=searchMatches[k];
  const data=mainData[index];
  const cells=rowValues(data);

  const tr=document.createElement('tr');

  tr.id='search-row-'+index;
  tr.dataset.index=index;

  for(let j=0;j<7;j++){
   const td=tr.insertCell();

   td.id='search-cell-'+index+'-'+j;

   charButtons(
    td,
    cells[j],
    'search-'+index+'-'+j
   );
  }

  fragment.appendChild(tr);
 }

 if(end<searchMatches.length){
  const tr=document.createElement('tr');

  tr.id='search-more-row';

  const td=tr.insertCell();

  td.id='search-more-cell';
  td.colSpan=7;

  const b=document.createElement('button');

  b.id='search-more-button';
  b.type='button';
  b.textContent=
   `顯示更多（${end} / ${searchMatches.length}）`;

  b.addEventListener('click',()=>{
   tr.remove();
   renderSearchResults(end);
  });

  td.appendChild(b);
  fragment.appendChild(tr);
 }

 searchBody.appendChild(fragment);
}

cfa.addEventListener('click',e=>{
 const tr=e.target.closest('tr[data-index]');

 if(!tr)return;

 jumpToRow(
  Number(tr.dataset.index)
 );
});

$('cfb1').addEventListener('click',()=>{
 searchColumn([2]);
});

$('cfb2').addEventListener('click',()=>{
 searchColumn([3,4]);
});

$('cfb3').addEventListener('click',()=>{
 searchColumn([6]);
});

/* ==================== 取代 ==================== */

$('cpb').addEventListener('click',()=>{
 const q=getSearch();

 if(!q)return;

 const replacement=getReplace();

 let any=false;

 for(const row of mainData){
  for(let j=0;j<3;j++){
   const old=row.edit[j];

   if(old.includes(q)){
    row.edit[j]=first(
     old.replaceAll(q,replacement)
    );

    any=true;
   }
  }
 }

 for(const row of extraData){
  for(let j=0;j<3;j++){
   const old=row[j];

   if(old.includes(q)){
    row[j]=first(
     old.replaceAll(q,replacement)
    );

    any=true;
   }
  }
 }

 if(any){
  renderVisible(true);
  renderExtra();
  updateBg();

  searchBody.replaceChildren();
  searchMatches=[];

  changed();
 }
});

/* ==================== GitHub API ==================== */

async function github(options={}){
 const r=await fetch(
  API+'?ref='+encodeURIComponent(BRANCH),
  {
   cache:'no-store',
   ...options,
   headers:{
    Accept:'application/vnd.github+json',
    ...(options.headers||{})
   }
  }
 );

 if(!r.ok){
  throw Error(
   'GitHub HTTP '+r.status+'：'+
   (await r.text()).slice(0,400)
  );
 }

 return r.json();
}

/* ==================== 字型載入 ==================== */

async function loadFonts(){
 const families=[
  '華瑞小篆體',
  'TW-MOE-Std-Kai',
  sealFamily,
  'Jigmo',
  'Jigmo2',
  'Jigmo3'
 ];

 for(let i=0;i<families.length;i++){
  const family=families[i];

  progress(
   15+20*i/families.length,
   '正在載入字型',
   `${i+1}/${families.length}：${family}`
  );

  const face=[...document.fonts].find(
   f=>f.family.replace(/^['"]|['"]$/g,'')===family
  );

  if(!face){
   throw Error('找不到字型宣告：'+family);
  }

  await face.load();

  if(face.status!=='loaded'){
   throw Error('字型載入失敗：'+family);
  }
 }

 progress(35,'字型檔案已載入');
}

/* ==================== 資料解析 ==================== */

async function parseData(text,sw){
 originalBOM=text.startsWith('\uFEFF')?'\uFEFF':'';

 if(originalBOM){
  text=text.slice(1);
 }

 originalNewline=text.includes('\r\n')?'\r\n':'\n';
 originalTrailingNewline=/\r?\n$/.test(text);

 const lines=text.replace(/\r\n/g,'\n').split('\n');
 const seals=sw.replace(/\r\n/g,'\n').split('\n');

 if(lines.length<TOTAL||seals.length<TOTAL){
  throw Error(
   `資料不足 ${TOTAL} 行（mozi：${lines.length}、shuowen：${seals.length}）`
  );
 }

 loaded=false;

 const nextMain=[];

 progress(35,'正在解析主表資料');

 for(let i=0;i<TOTAL;i++){
  const m=chars(lines[i]).slice(0,3);
  const s=seals[i].split('\t');

  nextMain.push({
   edit:[
    first(m[0]||''),
    first(m[1]||''),
    first(m[2]||'')
   ],
   seal:[
    s[0]||'',
    s[1]||'',
    s[2]||''
   ]
  });

  if(i%1000===999){
   progress(
    35+40*(i+1)/TOTAL,
    '正在解析主表資料',
    `${i+1} / ${TOTAL} 行`
   );

   await nextFrame();
  }
 }

 progress(78,'正在解析附加資料');

 const tail=lines.slice(TOTAL);

 if(originalTrailingNewline&&tail.at(-1)===''){
  tail.pop();
 }

 const nextExtra=tail.map(line=>{
  const m=chars(line);

  return [
   first(m[0]||''),
   first(m[1]||''),
   first(m[2]||'')
  ];
 });

 mainData=nextMain;
 extraData=nextExtra;

 progress(85,'正在建立附加資料表');

 mainBody.replaceChildren();
 searchBody.replaceChildren();

 renderExtra();

 progress(90,'正在計算差異字元');

 updateBg();

 progress(95,'正在初始化虛擬捲動');

 renderedStart=-1;
 renderedEnd=-1;
 highlightedIndex=-1;
 searchMatches=[];

 viewport.scrollTop=0;

 loaded=true;
 dirty=false;

 status('已載入 mozi.txt');

 progress(
  98,
  '資料初始化完成',
  `${mainData.length} 行主表、${extraData.length} 行附加資料`
 );
}

/* ==================== 載入 ==================== */

async function loadData(){
 if(loading||saving)return;

 if(dirty){
  status('有尚未儲存的修改、請先儲存後再重新載入');
  return;
 }

 loading=true;
 showLoading();

 status('正在載入…');

 try{
  progress(2,'正在下載 TXT 檔案');

  const [file,sw]=await Promise.all([
   github(),
   fetch('shuowen.txt').then(r=>{
    if(!r.ok){
     throw Error('shuowen.txt HTTP '+r.status);
    }

    return r.text();
   })
  ]);

  progress(15,'TXT 下載完成');
  await nextFrame();

  await loadFonts();

  progress(35,'正在解碼 TXT');
  await nextFrame();

  await parseData(
   decode(file.content),
   sw
  );

  sha=file.sha;

  progress(99,'正在顯示可見行');

  finishLoading();
 }catch(e){
  failLoading(e);
 }finally{
  loading=false;
 }
}

$('reload').addEventListener('click',loadData);
$('retry').addEventListener('click',loadData);

/* ==================== 儲存 ==================== */

$('cs').addEventListener('click',async()=>{
 if(saving||loading)return;

 if(!loaded){
  status('請先載入 mozi.txt');
  return;
 }

 const token=tokenInput.value.trim();

 if(!token){
  status('請先在上方輸入 GitHub Token');
  tokenInput.focus();
  return;
 }

 const head=mainData.map(
  row=>row.edit.join('')
 );

 const tail=extraData.map(
  row=>row.join('')
 );

 let content=[...head,...tail].join('\n');

 if(originalTrailingNewline){
  content+='\n';
 }

 content=originalBOM+
  content.replace(/\n/g,originalNewline);

 saving=true;
 $('cs').disabled=true;

 status('正在儲存…');

 try{
  const result=await github({
   method:'PUT',
   headers:{
    Authorization:'Bearer '+token,
    'Content-Type':'application/json'
   },
   body:JSON.stringify({
    message:'更新 mozi.txt',
    content:encode(content),
    sha,
    branch:BRANCH
   })
  });

  sha=result.content.sha;
  dirty=false;

  status('已提交至 GitHub mozi 分支');
 }catch(e){
  console.error(e);
  status('儲存失敗：'+e.message);
 }finally{
  saving=false;
  $('cs').disabled=false;
 }
});

loadData();
</script>
</head>
