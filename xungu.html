<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>訓詁工具書查詢</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { display: flex; flex-direction: column; font-family: system-ui, sans-serif; color: #222; background: #fff; }
    header { flex: 0 0 auto; padding: 18px 16px; border-bottom: 1px solid #ddd; background: #fff; }
    h1 { margin: 0 0 12px; font-size: 22px; font-weight: 500; text-align: center; }
    #searchForm { display: flex; gap: 10px; max-width: 600px; margin: auto; }
    #searchInput { flex: 1; min-width: 0; height: 44px; padding: 0 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; }
    #searchButton { height: 44px; padding: 0 20px; border: 0; border-radius: 8px; background: #222; color: white; font-size: 16px; cursor: pointer; }
    #resultFrame { flex: 1 1 auto; width: 100%; min-height: 0; border: 0; background: #fff; }
    #hint { flex: 1 1 auto; display: grid; place-items: center; color: #777; }
    @media (max-width: 480px) { header { padding: 12px; } h1 { font-size: 20px; } }
  </style>
</head>
<body>
  <header>
    <h1>訓詁工具書查詢</h1>
    <form id="searchForm" action="https://xungu-proxy.tayloryep777.workers.dev/search" method="get" target="resultFrame">
      <input id="searchInput" type="search" name="word" placeholder="輸入漢字或詞語" autocomplete="off" required>
      <button id="searchButton" type="submit">搜尋</button>
    </form>
  </header>
  <div id="hint">請輸入漢字或詞語進行搜尋</div>
  <iframe id="resultFrame" name="resultFrame" title="訓詁查詢結果" style="display:none" referrerpolicy="no-referrer"></iframe>
  <script>
    const form = document.getElementById('searchForm');
    const hint = document.getElementById('hint');
    const frame = document.getElementById('resultFrame');
    form.addEventListener('submit', function () {
      hint.style.display = 'none';
      frame.style.display = 'block';
    });
  </script>
</body>
</html>
