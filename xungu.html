<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>訓詁工具書查詢</title>
  <style>
    html, body { height: 100%; }
    body { margin: 0; display: flex; justify-content: center; align-items: center; font-family: system-ui, sans-serif; }
    main { width: min(90vw, 520px); text-align: center; }
    h1 { font-size: 26px; font-weight: 600; margin: 0 0 28px; }
    .search { display: flex; gap: 10px; }
    input { flex: 1; min-width: 0; padding: 12px 14px; border: 1px solid #aaa; border-radius: 8px; font-size: 18px; }
    button { padding: 12px 20px; border: 0; border-radius: 8px; background: #222; color: white; font-size: 17px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>訓詁工具書查詢</h1>
    <div class="search">
      <input id="word" type="search" placeholder="輸入漢字或詞語" aria-label="搜尋文字">
      <button id="searchButton" type="button">搜尋</button>
    </div>
  </main>
  <script>
    /* 完全沿用提供的網站之 kaom.net POST 查詢函數 */
    function searchKaom(word) {
      const form = document.createElement('form');

      form.method = 'post';
      form.action = 'https://www.kaom.net/book_xungu8.php';
      form.target = '_blank';

      const input = document.createElement('input');
      input.type = 'hidden';
      input.name = 'word';
      input.value = word;

      const bianti = document.createElement('input');
      bianti.type = 'hidden';
      bianti.name = 'bianti';
      bianti.value = 'yes';

      const page = document.createElement('input');
      page.type = 'hidden';
      page.name = 'page';
      page.value = 'no';

      form.appendChild(input);
      form.appendChild(bianti);
      form.appendChild(page);

      document.body.appendChild(form);

      form.submit();

      form.remove();
    }

    const wordInput = document.getElementById('word');
    function submitSearch() {
      const word = wordInput.value.trim();
      if (word) searchKaom(word);
    }
    document.getElementById('searchButton').addEventListener('click', submitSearch);
    wordInput.addEventListener('keydown', function(event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        submitSearch();
      }
    });
  </script>
</body>
</html>
