<div>
  <a href="#" onclick="searchKaom('世'); return false;">世</a>
</div>

<script>
function searchKaom(word) {
  const form = document.createElement('form');

  form.method = 'POST';
  form.action = 'https://www.kaom.net/book_xungu8.php';
  form.target = '_blank';
  form.acceptCharset = 'UTF-8';

  const input = document.createElement('input');
  input.type = 'hidden';
  input.name = 'word';
  input.value = word;

  const bianti = document.createElement('input');
  bianti.type = 'hidden';
  bianti.name = 'bianti';
  bianti.value = 'yes';

  const page = document.createElement('input');
  page.type = 'hidden';
  page.name = 'page';
  page.value = 'no';

  form.appendChild(input);
  form.appendChild(bianti);
  form.appendChild(page);

  document.body.appendChild(form);
  form.submit();
}
</script>
